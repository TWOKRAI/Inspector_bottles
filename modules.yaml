# Карта «путь -> модуль» (Task 0.3, plans/2026-10-04_atlas; Д5 — Task 4.4b). Ведётся руками.
# Формат и правила — plans/2026-10-04_atlas/tasks/0.3.md; потребитель — scripts/atlas/modules.py.
# Юнит — прямой подкаталог корня из `roots` с __init__.py, кроме `root_exclude`: строку (id, paths, layer, docs,
# purpose = первая строка докстринга __init__.py) собирает expand_roots, здесь её писать не нужно.
#   id = id_prefix + имя каталога; tier берётся из `tiers` (нет id — null); docs — README/STATUS/DECISIONS на диске.
# `modules:` держит только исключения: всё, что не прямой подкаталог корня (вложенные пакеты, prototype/, tools/,
# scripts/) или у чего parent/paths не по схеме юнита. Строки юнитов идут первыми, затем эти записи, в этом порядке.
# paths: элемент с «/» на конце — префикс каталога, без «/» — точный файл. Самый длинный элемент побеждает.
version: 1

# Что законно остаётся без модуля (резолвится в "other"). Корни слоёв сюда не попадают.
other_allowed: ["run.py", "conftest.py", ".claude/", "docs/", "plans/", "workspace/"]

roots:
  - path: "multiprocess_framework/modules/"
    layer: framework
    id_prefix: ""
  - path: "Services/"
    layer: services
    id_prefix: "services/"
  - path: "Plugins/"
    layer: plugins
    id_prefix: "plugins/"
root_exclude: [tests, _shared]

# Ярус юнита (core | optional); юниты без записи — tier: null.
tiers:
  actions_module: optional
  app_module: optional
  base_manager: core
  chain_module: core
  channel_routing_module: core
  command_module: core
  config_module: core
  console_module: core
  data_schema_module: core
  dispatch_module: core
  display_module: optional
  error_module: core
  event_module: optional
  frontend_module: optional
  logger_module: core
  message_module: core
  process_manager_module: core
  process_module: core
  recipe: optional
  registers_module: optional
  router_module: core
  service_module: optional
  shared_resources_module: core
  state_store_module: optional
  statistics_module: core
  telemetry_readmodel_module: optional
  worker_module: core

modules:
  - id: "framework_meta"
    paths: [
      "multiprocess_framework/__init__.py",
      "multiprocess_framework/version.py",
      "multiprocess_framework/modules/__init__.py",
      "multiprocess_framework/modules/_fallback.py",
      "multiprocess_framework/modules/conftest.py",
      "multiprocess_framework/modules/observability_declarations.py",
      "multiprocess_framework/docs/",
    ]
    layer: framework
    tier: null
    docs: [
      "multiprocess_framework/README.md",
      "multiprocess_framework/DECISIONS.md",
      "multiprocess_framework/docs/README.md",
    ]
    parent: null
    purpose: "Корневые файлы пакета фреймворка и его документация; сюда — менять версию, общие импорты, доки фреймворка"
  - id: "services_shared"
    paths: [
      "Services/__init__.py",
    ]
    layer: services
    tier: null
    docs: [
      "Services/STATUS.md",
    ]
    parent: null
    purpose: "Корневой пакет Services и его STATUS; общий уровень сервисов"
  - id: "plugins_shared"
    paths: [
      "Plugins/__init__.py",
      "Plugins/_shared/",
    ]
    layer: plugins
    tier: null
    docs: []
    parent: null
    purpose: "Общие доменные утилиты нескольких плагинов, сами не плагины; сюда — менять общий код плагинов"
  - id: "prototype/adapters"
    paths: [
      "multiprocess_prototype/adapters/",
    ]
    layer: prototype
    tier: null
    docs: [
      "multiprocess_prototype/adapters/README.md",
    ]
    parent: null
    purpose: "Adapter-слой между domain Protocols и реестрами фреймворка; сюда — менять привязку domain к реестрам"
  - id: "prototype/backend"
    paths: [
