# Карта «путь -> модуль» (Task 0.3, plans/2026-10-04_atlas). Ведётся руками.
# Формат и правила — plans/2026-10-04_atlas/tasks/0.3.md; потребитель — scripts/atlas/modules.py.
# paths: элемент с «/» на конце — префикс каталога, без «/» — точный файл. Самый длинный элемент побеждает.
