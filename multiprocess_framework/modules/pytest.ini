[pytest]
# Корректный запуск:
#   cd Inspector_bottles && python scripts/run_framework_tests.py
# или:
#   cd Inspector_bottles/multiprocess_framework/modules && python -m pytest
#
# Все импорты в коде и тестах — каноничные:
#   from multiprocess_framework.modules.<module> import ...
# Поэтому pythonpath здесь не нужен; пакет multiprocess_framework доступен через
# editable installation Inspector_bottles (uv sync / pip install -e).

# pytest-asyncio: режим auto — декораторы @pytest.mark.asyncio не нужны явно
asyncio_mode = auto

# pytest-qt: использовать PySide6 (PyQt5 удалён из venv)
qt_api = pyside6

markers =
    # frontend-constructor Ф1 (T1.2): тесты Gen-1 frontend_module (application/,
    # core.window_registry, schemas.widget_descriptor/window_config, windows.loading_window) —
    # freeze, не kill (Р4 plans/frontend-constructor/plan.md). Инвентарь — frontend_module/STATUS.md.
    legacy_gen1: тесты первого (мёртвого для v3) поколения frontend_module

# 2026-08-11 (задача 3.3): снята мёртвая запись `frontend_module/actions/handlers/tests`.
# Каталог уехал в `actions_module` carve-out'ом ADR-124 (2026-05-11, `git mv`), а запись
# осталась и читалась как «покрыто»: pytest на несуществующий путь даёт 0 items и exit 0.
# Живое покрытие — `actions_module/tests` и `actions_module/handlers/tests` ниже.
# Страж `test_every_testpath_points_at_something_that_exists` молчал три месяца: на диске
# лежал ПУСТОЙ каталог, и путь «существовал». Ложь стала наблюдаемой только после сноса
# скелета — то есть страж проверял наличие каталога, а не наличие тестов в нём.
testpaths =
    # Кросс-модульные контракт-тесты (ярусная карта, публичный API — Ф8 H.1)
    tests
    actions_module/tests
    actions_module/handlers/tests
    app_module/tests
    base_manager/tests
    chain_module/tests
    channel_routing_module/tests
    command_module/tests
    config_module/tests
    config_module/tools/tests
    console_module/tests
    data_schema_module/tests
    display_module/tests
    dispatch_module/tests
    error_module/tests
    event_module/tests
    frontend_module/tests
    frontend_module/graph/tests
    logger_module/tests
    message_module/tests
    process_manager_module/tests
    process_module/tests
    process_module/plugins/tests
    recipe/tests
    registers_module/tests
    router_module/tests
    service_module/tests
    shared_resources_module/tests
    shared_resources_module/buffers/tests
    shared_resources_module/memory/tests
    state_store_module/tests
    statistics_module/tests
    telemetry_readmodel_module/tests
    worker_module/tests
