/* ---------- раскладка (сетка по умолчанию, ELK по желанию) ---------- */

async function computeBoxes(visSet, wires) {
  const idx = S.idx;
  const boxes = new Map();
  const visKids = (id) => (S.expanded.has(id) ? idx.children.get(id).filter(c => visSet.has(c)) : []);
  let x = 0;
  // в обзоре слоёв подписи проводов лежат над и под рядом, зазор можно сузить
  const allCollapsed = idx.roots.every(l => !visSet.has(l) || !S.expanded.has(l));
  const gap = allCollapsed ? 120 : LAYER_GAP;
  const useElk = S.useElk && S.elk;
  let note = useElk ? 'раскладка ELK' : 'сетка колонок';
  for (const layerId of idx.roots) {
    if (!visSet.has(layerId)) continue;
    let lb = null;
    if (useElk) {
      try {
        const res = await S.elk.layout(elkGraph(idx, layerId, visKids, wires));
        lb = new Map();
        readElk(res, lb, 0, 0, 0);
      } catch (e) {
        console.error('ELK, слой ' + layerId, e);
        note = 'ELK упал на слое ' + layerId + ' (' + (e && e.message ? e.message : e) + '), сетка';
        lb = null;
      }
    }
    if (!lb) lb = packLayer(idx, layerId, visKids);
    const root = lb.get(layerId);
    for (const [id, b] of lb) { b.x += x; boxes.set(id, b); }
    x += root.w + gap;
  }
  S.layoutNote = note;
  return boxes;
}

/* ---------- главный цикл отрисовки ---------- */

// Полная пересборка: агрегирование проводов, раскладка, элементы cytoscape. o: {fit, anchor, center}.
function render(o) {
  return renderCore(o).catch((e) => { console.error(e); showFatal(e); });
}

async function renderCore(o) {
  o = o || {};
  const my = ++S.token;
  const idx = S.idx;
  const cy = S.cy;
  const agg = aggregateWires(idx, S.expanded, { kinds: S.kinds, hiddenLayers: S.hiddenLayers });
  S.agg = agg;
  let wires = agg.list;
  if (S.onlyViol) wires = wires.filter(w => w.sev >= 2);

  // режим «фокус»: нужен выбранный узел или провод
  let allowed = null;
  let focusNote = '';
  if (S.focus) {
    const sel = S.selected;
    if (sel) {
      const targets = new Set();
      if (sel.type === 'node') { const r = agg.rep(sel.id); if (r) targets.add(r); }
      else { targets.add(sel.src); targets.add(sel.dst); }
      if (targets.size) {
        const sub = focusSubset(wires, targets);
        allowed = withAncestors(idx, new Set([...sub.nodes, ...targets]));
        wires = sub.wires;
      }
    } else focusNote = ' · фокус: выберите узел';
  }

  const vis = visibleNodes(idx, S.expanded, S.hiddenLayers, allowed);
  const visSet = new Set(vis);
  wires = wires.filter(w => visSet.has(w.src) && visSet.has(w.dst));

  const boxes = await computeBoxes(visSet, wires);
  if (my !== S.token) return;       // пришёл более новый запрос

  // положение якоря на экране до пересборки
  let anchor = null;
  if (o.anchor) {
    const an = cy.getElementById(o.anchor);
    if (an && an.nonempty()) anchor = { id: o.anchor, rp: an.renderedPosition() };
  }

  // уровень слоёв: все концы проводов — свёрнутые слои
  const overview = wires.length > 0 && wires.every(w => idx.byId.get(w.src).kind === 'layer' && idx.byId.get(w.dst).kind === 'layer');
  const reverseKeys = new Set(wires.map(w => w.src + SEP + w.dst));
  const els = [];
  const endpoints = new Set();
  for (const w of wires) { endpoints.add(w.src); endpoints.add(w.dst); }
  for (const id of vis) {
    const n = idx.byId.get(id);
    const b = boxes.get(id);
    if (!b) continue;
    const isExp = S.expanded.has(id) && b.cont;
    const classes = [n.kind];
    if (b.cont) classes.push('cont');
    if (n.kind === 'unit') classes.push('tier-' + tierOf(n));
    els.push({
      group: 'nodes',
      data: { id, label: nodeLabel(idx, n, isExp), w: Math.round(b.w), h: Math.round(b.h), tw: Math.max(40, Math.round(b.w) - 14), z: b.depth * 2 + 1 },
      position: { x: b.x + b.w / 2, y: b.y + b.h / 2 },
      classes: classes.join(' '),
      selectable: false, grabbable: false
    });
    // значок считает только error и warn: info (unit-undeclared, unit-hygiene) значки не раздувает
    const nf = idx.nodeFind.get(id);
    if (n.kind === 'layer' && !b.cont) {
      // свёрнутый слой: сводка (счётчики и находки) отдельным узлом в нижней части рамки; значок не нужен
      els.push({
        group: 'nodes',
        data: { id: 'c:' + id, label: layerCaption(idx, id), w: Math.round(b.w), h: 160, tw: Math.round(b.w) - 20, z: 92 },
        position: { x: b.x + b.w / 2, y: b.y + b.h - 88 },
        classes: 'lcap aux', selectable: false, grabbable: false
      });
    } else if (nf && nf.ew > 0) {
      const txt = nf.ew > 99 ? '99+' : String(nf.ew);
      els.push({
        group: 'nodes',
        data: { id: 'b:' + id, label: txt, w: 16 + txt.length * 5, h: 18, z: 95 },
        position: { x: b.x + b.w - 4, y: b.y + 2 },
        classes: 'badge aux ' + (nf.error ? 'b-err' : 'b-warn'),
        selectable: false, grabbable: false
      });
    }
  }
  for (const w of wires) {
    const cls = [wireDash(w) === 'solid' ? '' : wireDash(w)];
    const cn = wireColorName(w);
    if (cn !== 'neutral') cls.push(cn);
    if (overview) {
      const span = Math.abs(idx.roots.indexOf(w.src) - idx.roots.indexOf(w.dst));
      cls.push('ovw', 'ovs' + Math.max(1, Math.min(8, span)));
    } else if (reverseKeys.has(w.dst + SEP + w.src)) cls.push(w.src < w.dst ? 'rv1' : 'rv2');
    els.push({
      group: 'edges',
      data: { id: wireId(w.src, w.dst), source: w.src, target: w.dst, w: wireWidth(w.count) * (overview ? 3 : 1), lbl: wireLabel(w, overview) },
      classes: cls.filter(Boolean).join(' ')
    });
  }

  cy.batch(() => {
    cy.elements().remove();
    cy.add(els);
  });
  S.view = { vis, visSet, wires, endpoints, overview };
  S.hover = null;
  refreshStyles();

  if (anchor) {
    const n2 = cy.getElementById(anchor.id);
    if (n2.nonempty()) {
      const z = cy.zoom();
      const p = n2.position();
      cy.pan({ x: anchor.rp.x - p.x * z, y: anchor.rp.y - p.y * z });
    }
  } else if (o.fit) cy.fit(undefined, overview ? 16 : 30);
  if (o.center) centerOn(o.center, o.instant);

  renderStatus(agg, wires, vis, focusNote);
  renderPanel();
  renderTree();
  writeHash();
}

function wireId(a, b) { return 'w:' + a + '>' + b; }

function renderStatus(agg, wires, vis, extra) {
  const st = $('status');
  st.textContent = 'вид: ' + viewName(S.idx, S.expanded) + ' \u00b7 узлов: ' + vis.length + ' \u00b7 проводов: ' + wires.length + ' (импортов под ними: ' +
    wires.reduce((s, w) => s + w.count, 0) + ' из ' + S.idx.E.length + ') \u00b7 ' + S.layoutNote + (extra || '');
}

// Выделение, затемнение: меняются классами без пересборки.
function refreshStyles() {
  const cy = S.cy;
  if (!cy || !S.view) return;
  const idx = S.idx;
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const id = n.id();
      if (isAux(id)) return;
      let dim = dimmedByContour(idx, id, S.contours);
      if (!dim && S.onlyViol && !n.hasClass('cont') && !S.view.endpoints.has(id)) dim = true;
      n.toggleClass('dim', dim);
      n.toggleClass('sel', !!(S.selected && S.selected.type === 'node' && S.selected.id === id));
    });
    cy.nodes('.aux').forEach(b => {
      const owner = cy.getElementById(b.id().slice(2));
      b.toggleClass('dim', owner.hasClass('dim'));
    });
    cy.edges().forEach(e => {
      const a = e.source();
      const b = e.target();
      e.toggleClass('dim', a.hasClass('dim') || b.hasClass('dim'));
      e.toggleClass('sel', !!(S.selected && S.selected.type === 'wire' && wireId(S.selected.src, S.selected.dst) === e.id()));
    });
  });
  refreshHighlight();
}

// Подсветка по наведению или выбору: провода узла (исходящие и входящие разным цветом), остальное приглушено.
// Ничего не убирается со схемы — только классы.
function refreshHighlight() {
  const cy = S.cy;
  if (!cy || !S.view) return;
  const focusIds = [];
  if (S.hover) focusIds.push(S.hover);
  else if (S.selected && S.selected.type === 'node') focusIds.push(S.selected.id);
  else if (S.selected && S.selected.type === 'wire') focusIds.push(S.selected.src, S.selected.dst);
  cy.batch(() => {
    cy.edges().removeClass('hl-out hl-in faded');
    cy.nodes().removeClass('faded');
    if (!focusIds.length) return;
    const keep = new Set();
    const hlEdges = new Set();
    for (const id of focusIds) {
      const n = cy.getElementById(id);
      if (!n || n.empty()) continue;
      const es = n.connectedEdges();
      if (es.empty()) continue;       // контейнер или узел без проводов: подсвечивать нечего
      keep.add(id);
      es.forEach(e => {
        hlEdges.add(e.id());
        keep.add(e.source().id());
        keep.add(e.target().id());
        e.addClass(focusIds.includes(e.source().id()) ? 'hl-out' : 'hl-in');
      });
    }
    if (!keep.size) return;
    cy.edges().forEach(e => { if (!hlEdges.has(e.id()) && !e.hasClass('sel')) e.addClass('faded'); });
    cy.nodes().forEach(n => {
      const id = n.id();
      if (isAux(id)) { if (!keep.has(id.slice(2))) n.addClass('faded'); return; }
      if (n.hasClass('cont') || keep.has(id)) return;
      n.addClass('faded');
    });
  });
}

function centerOn(id, instant) {
  const cy = S.cy;
  const n = cy.getElementById(id);
  if (!n || n.empty()) return;
  if (instant) { cy.zoom(Math.max(cy.zoom(), 0.7)); cy.center(n); return; }   // без анимации: кадр сразу готов к снимку
  cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.7) }, { duration: 250 });
}

/* ---------- адрес страницы: состояние читается при загрузке и пишется при изменении ---------- */

function currentHashState() {
  return {
    expanded: S.expanded,
    selectedId: S.selected && S.selected.type === 'node' ? S.selected.id : null,
    focus: S.focus, kinds: S.kinds, viol: S.onlyViol,
    panel: $('drawer').hidden ? null : 'findings',
    layout: S.useElk ? 'elk' : null
  };
}

function writeHash() {
  try {
    if (typeof history === 'undefined' || typeof location === 'undefined') return;
    S.lastHash = '#' + stateToHash(S.idx, currentHashState());
    history.replaceState(null, '', S.lastHash);
  } catch (e) { console.warn('адрес не обновился', e); }
}

function setDrawer(open) {
  $('drawer').hidden = !open;
  $('b-find').classList.toggle('on', open);
}

// Применяет #… к состоянию и синхронизирует органы управления.
function applyHash() {
  const p = parseHash(typeof location !== 'undefined' ? location.hash : '');
  const r = resolveHash(S.idx, p);
  S.expanded = r.expanded;
  S.selected = r.selected;
  S.focus = r.focus;
  S.kinds = r.kinds;
  S.onlyViol = r.viol;
  S.useElk = r.layout === 'elk';
  $('k-hard').checked = S.kinds.hard;
  $('k-lazy').checked = S.kinds.lazy;
  $('k-tc').checked = S.kinds.tc;
  $('f-viol').checked = S.onlyViol;
  $('b-focus').classList.toggle('on', S.focus);
  setDrawer(r.panel === 'findings');
  if (S.selected) for (const a of ancestorsOf(S.idx, S.selected.id)) S.treeOpen.add(a);
  return render({ fit: true, center: S.selected ? S.selected.id : null, instant: true });
}

/* ---------- действия над схемой ---------- */

function toggleNode(id) {
  const idx = S.idx;
  if (!idx.children.get(id).length) return;
  const wasExpanded = S.expanded.has(id);
  if (wasExpanded) S.expanded.delete(id); else S.expanded.add(id);
  // выбранное внутри свёрнутого контейнера переезжает на контейнер
  const sel = S.selected;
  if (sel && wasExpanded) {
    if (sel.type === 'node' && sel.id !== id && idx.chain(sel.id).includes(id)) S.selected = { type: 'node', id };
    else if (sel.type === 'wire' && (idx.chain(sel.src).includes(id) || idx.chain(sel.dst).includes(id)) && sel.src !== id && sel.dst !== id) S.selected = null;
  }
  return render({ anchor: id });
}

function revealAncestors(id) {
  for (const a of ancestorsOf(S.idx, id)) S.expanded.add(a);
  S.hiddenLayers.delete(S.idx.chain(id)[0]);
  syncLayerMenu();
}

// Выбор узла из дерева, поиска и списков: раскрывает предков, выделяет, центрирует.
function selectNode(id, center) {
  if (!S.idx.byId.has(id)) return;
  revealAncestors(id);
  S.selected = { type: 'node', id };
  S.wireRows = ROWS_STEP;
  for (const a of ancestorsOf(S.idx, id)) S.treeOpen.add(a);
  return render({ center: center === false ? null : id });
}

// Выбор пары из таблицы находок: обе стороны сворачиваются в юниты, провод между ними выделяется.
function selectPair(a, b) {
  if (!b || !S.idx.byId.has(b) || !S.idx.byId.has(a)) { if (a) selectNode(a); return; }
  revealAncestors(a);
  revealAncestors(b);
  S.expanded.delete(a);
  S.expanded.delete(b);
  S.selected = { type: 'wire', src: a, dst: b };
  S.wireRows = ROWS_STEP;
  return render({ center: a });
}

function setSelection(sel) {
  S.selected = sel;
  S.wireRows = ROWS_STEP;
  if (sel && sel.type === 'node') for (const a of ancestorsOf(S.idx, sel.id)) S.treeOpen.add(a);
  if (S.focus) render();
  else { refreshStyles(); renderPanel(); renderTree(); writeHash(); }
}

/* ---------- панель «Спецификация» ---------- */

function unitLink(id) {
  const n = S.idx.byId.get(id);
  return el('button', { class: 'link', title: id, onclick: () => selectNode(id) }, n ? n.name : id);
}

function sevClass(sevN) { return sevN >= 3 ? 'err' : (sevN === 2 ? 'warn' : ''); }

function kvTable(rows) {
  return el('table', null, rows.map(([k, v]) => el('tr', null, el('td', { class: 'k' }, k), el('td', null, v))));
}

function valueNode(v) {
  if (v === null || v === undefined || v === '') return el('span', { class: 'muted' }, '—');
  if (Array.isArray(v)) return v.length ? el('ul', null, v.map(x => el('li', null, typeof x === 'object' ? JSON.stringify(x) : String(x)))) : el('span', { class: 'muted' }, '—');
  if (typeof v === 'object') {
    // словарь (например card.sources: поле -> файл) — построчно «ключ: значение»
    return el('div', null, Object.keys(v).map(k => el('div', { class: 'mono' }, k + ': ' + (typeof v[k] === 'object' && v[k] !== null ? JSON.stringify(v[k]) : String(v[k])))));
  }
  return String(v);
}

function sectionTitle(t) { return el('h4', null, t); }

function findingItem(f, showPair) {
  const idx = S.idx;
  return el('div', { class: 'fi ' + sevClass(f.sevN) },
    el('div', null, el('span', { class: 'chip ' + sevClass(f.sevN) }, f.severity || 'info'), ' ', f.where ? el('span', { class: 'mono' }, f.where) : ''),
    showPair && (f.src_unit || f.dst_unit) ? el('div', { class: 'muted' }, f.src_unit ? nodeTitle(idx, f.src_unit) : '?', ' → ', f.dst_unit ? nodeTitle(idx, f.dst_unit) : '?') : '',
    el('div', null, f.detail || ''));
}

function findingsBlock(ids, cap) {
  if (!ids.length) return el('p', { class: 'muted' }, 'находок нет');
  const groups = findingsByRule(S.idx, ids);
  return el('div', null, groups.map(g => {
    const shown = g.items.slice(0, cap);
    return el('div', null,
      el('div', null, el('b', null, g.rule), ' ', el('span', { class: 'muted' }, '×' + g.items.length + (RULE_TITLES[g.rule] ? ' — ' + RULE_TITLES[g.rule] : ''))),
      shown.map(f => findingItem(f, true)),
      g.items.length > shown.length ? el('div', { class: 'muted' }, 'и ещё ' + (g.items.length - shown.length) + '…') : '');
  }));
}

// Карточка таблицей «поле | значение | источник». Объявляемое человеком поле без значения — «не объявлено».
// Находки error и warn — сразу; info (unit-undeclared, unit-hygiene) — отдельной свёрнутой группой.
function findingsSection(fids) {
  const main = fids.filter(fi => S.idx.F[fi].sevN >= 2);
  const info = fids.filter(fi => S.idx.F[fi].sevN < 2);
  const out = [sectionTitle('Находки (' + main.length + ')'), findingsBlock(main, 50)];
  if (info.length) out.push(el('details', { class: 'info' }, el('summary', null, 'Информационные (' + info.length + ')'), findingsBlock(info, 50)));
  return out;
}

function renderCard(spec) {
  const card = spec && spec.card;
  if (!card) return el('p', { class: 'nocard' }, 'карточки нет');
  const src = (card.sources && typeof card.sources === 'object') ? card.sources : {};
  const rows = [];
  const empty = (v) => v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length);
  const row = (label, val, key) => rows.push(el('tr', null, el('td', { class: 'k' }, label), el('td', null, val), el('td', { class: 'src' }, src[key] ? String(src[key]) : '\u2014')));
  for (const k of CARD_ORDER) {
    if (!(k in card) && !CARD_DECLARED.includes(k)) continue;
    const v = card[k];
    if (CARD_DECLARED.includes(k) && empty(v)) { row(CARD_LABELS[k], el('span', { class: 'undecl' }, 'не объявлено'), k); continue; }
    let node;
    if (k === 'contour') node = el('span', null, (Array.isArray(v) ? v : [v]).map(c => el('span', { class: 'chip' }, String(c))));
    else if (k === 'commands') {
      const list = Array.isArray(v) ? v : [];
      node = list.length ? el('div', null, el('div', { class: 'muted' }, list.length + ' шт.'), el('div', { class: 'wrapl' }, list.map(c => el('span', null, String(c))))) : el('span', { class: 'muted' }, '\u2014');
    } else if (k === 'threads') {
      const list = Array.isArray(v) ? v : [];
      node = list.length ? el('div', null, list.map(t => el('div', { class: 'mono' }, (t && typeof t === 'object') ? (t.name + ' \u2014 ' + (t.where || '?')) : String(t)))) : el('span', { class: 'muted' }, '\u2014');
    } else node = valueNode(v);
    row(CARD_LABELS[k], node, k);
  }
  for (const k of Object.keys(card)) {
    if (CARD_ORDER.includes(k) || k === 'sources') continue;
    row(k, valueNode(card[k]), k);
  }
  return el('table', { class: 'card' }, el('tr', null, el('th', null, 'поле'), el('th', null, 'значение'), el('th', null, 'источник')), rows);
}

function flag(ok) { return el('span', { class: 'chip ' + (ok ? 'yes' : 'no') }, ok ? 'есть' : 'нет'); }

function specUnit(n) {
  const idx = S.idx;
  const sp = n.spec || {};
  const out = [];
  out.push(sectionTitle('Карточка'));
  out.push(renderCard(sp));
  out.push(sectionTitle('Метрики'));
  const inst = typeof sp.instability === 'number' ? sp.instability.toFixed(2) : '—';
  out.push(kvTable([
    ['loc', sp.loc == null ? '—' : String(sp.loc)], ['файлов', sp.files == null ? '—' : String(sp.files)], ['тестов', sp.tests == null ? '—' : String(sp.tests)],
    ['fan_in', sp.fan_in == null ? '—' : String(sp.fan_in)], ['fan_out', sp.fan_out == null ? '—' : String(sp.fan_out)], ['instability', inst]
  ]));
  out.push(sectionTitle('Документы'));
  const d = sp.docs || {};
  out.push(el('div', null, ['readme', 'status', 'decisions', 'interfaces'].map(k => el('span', { style: 'margin-right:10px' }, k + ': ', flag(!!d[k])))));
  out.push(sectionTitle('Интерфейсы'));
  const ifs = Array.isArray(sp.interfaces) ? sp.interfaces : [];
  if (!ifs.length) out.push(el('p', { class: 'muted' }, 'нет'));
  for (const i of ifs) {
    out.push(el('div', { class: 'row' },
      el('b', null, i.name), ' ', el('span', { class: 'muted' }, i.style || ''), ' ', el('span', { class: 'mono muted' }, (i.file || '') + (i.line ? ':' + i.line : '')),
      Array.isArray(i.methods) && i.methods.length ? el('div', { class: 'mono' }, i.methods.join(', ')) : ''));
  }
  out.push(sectionTitle('__all__'));
  out.push(Array.isArray(sp.all) ? (sp.all.length ? el('div', { class: 'mono' }, sp.all.join(', ')) : el('p', { class: 'muted' }, 'пустой')) : el('p', { class: 'muted' }, 'нет'));
  out.push(sectionTitle('Классы (топ)'));
  const cls = Array.isArray(sp.classes_top) ? sp.classes_top : [];
  if (!cls.length) out.push(el('p', { class: 'muted' }, 'нет'));
  for (const c of cls) out.push(el('div', { class: 'row' }, el('b', null, c.name), (c.bases && c.bases.length) ? el('span', { class: 'muted' }, ' (' + c.bases.join(', ') + ')') : ''));
  const deps = unitDeps(idx, n.id);
  const depRows = (list) => list.length ? list.map(x => el('div', { class: 'row' }, unitLink(x.unit), ' ',
    el('span', { class: 'muted' }, 'hard ' + x.hard + ' · lazy ' + x.lazy + ' · tc ' + x.tc))) : el('p', { class: 'muted' }, 'нет');
  out.push(sectionTitle('Зависит от (' + deps.out.length + ')'));
  out.push(depRows(deps.out));
  out.push(sectionTitle('Используют (' + deps.inn.length + ')'));
  out.push(depRows(deps.inn));
  const fids = idx.unitFinds.get(n.id) || [];
  out.push(...findingsSection(fids));
  return out;
}

function importRows(idx, list, side, cap) {
  if (!list || !list.length) return el('p', { class: 'muted' }, 'нет');
  const shown = list.slice(0, cap);
  return el('div', null, shown.map(i => {
    const e = idx.E[i];
    const other = idx.byId.get(side === 'out' ? e.dst : e.src);
    return el('div', { class: 'row' },
      el('span', { class: 'mono' }, (other && other.path) || (side === 'out' ? e.dst : e.src)), el('span', { class: 'muted' }, e.line ? ':' + e.line : ''),
      ' ', el('span', { class: 'chip' }, e.kind), e.names.length ? el('div', { class: 'mono muted' }, e.names.join(', ')) : '');
  }), list.length > shown.length ? el('div', { class: 'muted' }, 'и ещё ' + (list.length - shown.length) + '…') : '');
}

function specFile(n) {
  const idx = S.idx;
  const out = [];
  out.push(kvTable([['loc', n.loc == null ? '—' : String(n.loc)], ['юнит', idx.unitOf(n.id) ? unitLink(idx.unitOf(n.id)) : '—']]));
  out.push(sectionTitle('Классы'));
  const cl = Array.isArray(n.classes) ? n.classes : [];
  if (!cl.length) out.push(el('p', { class: 'muted' }, 'нет'));
  for (const c of cl) out.push(el('div', { class: 'row' }, el('b', null, c.name), (c.bases && c.bases.length) ? el('span', { class: 'muted' }, ' (' + c.bases.join(', ') + ')') : '', c.line ? el('span', { class: 'muted' }, ' :' + c.line) : '',
    Array.isArray(c.methods) && c.methods.length ? el('div', { class: 'mono' }, c.methods.join(', ')) : ''));
  out.push(sectionTitle('Функции'));
  const fn = Array.isArray(n.functions) ? n.functions : [];
  out.push(fn.length ? el('div', { class: 'mono' }, fn.join(', ')) : el('p', { class: 'muted' }, 'нет'));
  const o = idx.edgesOut.get(n.id) || [];
  const i = idx.edgesIn.get(n.id) || [];
  out.push(sectionTitle('Импортирует (' + o.length + ')'));
  out.push(importRows(idx, o, 'out', 100));
  out.push(sectionTitle('Импортируют его (' + i.length + ')'));
  out.push(importRows(idx, i, 'in', 100));
  const fids = idx.fileFinds.get(n.id) || [];
  out.push(...findingsSection(fids));
  return out;
}

function specContainer(n) {
  const idx = S.idx;
  const s = summaryOf(idx, n.id);
  const out = [];
  out.push(sectionTitle('Сводка'));
  out.push(kvTable([
    ['юнитов', String(s.units)], ['групп', String(s.groups)], ['пакетов', String(s.packages)], ['файлов', String(s.files)],
    ['loc', String(s.loc)], ['тестов', String(s.tests)],
    ['находки', s.findings.n + ' (error ' + s.findings.error + ', warn ' + s.findings.warn + ', info ' + s.findings.info + ')']
  ]));
  if (n.kind === 'layer' || n.kind === 'group') {
    out.push(sectionTitle('Юниты'));
    out.push(s.unitIds.length ? s.unitIds.map(u => el('div', { class: 'row' }, unitLink(u))) : el('p', { class: 'muted' }, 'нет'));
  }
  return out;
}

function renderNodePanel(n) {
  const idx = S.idx;
  const box = $('spec');
  const kids = idx.children.get(n.id).length;
  const head = [
    el('h3', null, n.name),
    el('div', { class: 'sub' }, el('span', { class: 'kind' }, KIND_TITLES[n.kind] || n.kind), ' ', n.id),
    n.path ? el('div', { class: 'sub mono' }, n.path) : ''
  ];
  const btns = [];
  if (kids) {
    const exp = S.expanded.has(n.id);
    btns.push(el('button', { onclick: () => toggleNode(n.id) }, exp ? '− свернуть' : '+ развернуть'));
  }
  btns.push(el('button', { onclick: () => centerOn(n.id) }, 'найти на схеме'));
  let body;
  if (n.kind === 'unit') body = specUnit(n);
  else if (n.kind === 'file') body = specFile(n);
  else body = specContainer(n);
  box.textContent = '';
  box.append(...head, el('div', { class: 'btnrow' }, btns), ...body.flat(Infinity));
}

function renderWirePanel(sel) {
  const idx = S.idx;
  const box = $('spec');
  box.textContent = '';
  const w = S.agg ? S.agg.map.get(sel.src + SEP + sel.dst) : null;
  box.append(el('h3', null, 'Провод'), el('div', { class: 'sub' }, el('button', { class: 'link', onclick: () => selectNode(sel.src) }, nodeTitle(idx, sel.src)), ' → ', el('button', { class: 'link', onclick: () => selectNode(sel.dst) }, nodeTitle(idx, sel.dst))),
    el('div', { class: 'sub mono' }, sel.src + '  →  ' + sel.dst));
  if (!w) {
    box.append(el('p', { class: 'muted' }, 'Между этими узлами нет проводов при текущих раскрытиях и фильтрах.'));
    return;
  }
  box.append(kvTable([
    ['импортов', String(w.count)], ['hard', String(w.hard)], ['lazy', String(w.lazy)], ['tc', String(w.tc)],
    ['линия', wireDash(w) === 'solid' ? 'сплошная' : (wireDash(w) === 'dashed' ? 'пунктир' : 'точки')],
    ['цвет', wireColorName(w) === 'err' ? 'красный (есть ошибка)' : (wireColorName(w) === 'warn' ? 'оранжевый (предупреждения)' : 'нейтральный')]
  ]));
  if (w.extra.length) {
    box.append(sectionTitle('Находки на паре юнитов'));
    box.append(...w.extra.map(fi => findingItem(idx.F[fi], false)));
  }
  box.append(sectionTitle('Импорты (' + w.edges.length + ')'));
  const shown = w.edges.slice(0, S.wireRows);
  for (const ei of shown) {
    const e = idx.E[ei];
    const sn = idx.byId.get(e.src);
    const dn = idx.byId.get(e.dst);
    const fl = (idx.edgeFinds.get(ei) || []).map(fi => idx.F[fi]);
    box.append(el('div', { class: 'row' },
      el('div', { class: 'mono' }, ((sn && sn.path) || e.src) + (e.line ? ':' + e.line : '') + '  →  ' + ((dn && dn.path) || e.dst)),
      el('div', null, el('span', { class: 'chip' }, e.kind), ' ', el('span', { class: 'mono muted' }, e.names.join(', '))),
      fl.map(f => findingItem(f, false))));
  }
  if (w.edges.length > shown.length) {
    box.append(el('button', { onclick: () => { S.wireRows += ROWS_STEP; renderPanel(); } }, 'показать ещё (' + (w.edges.length - shown.length) + ')'));
  }
}

function renderPanel() {
  const sel = S.selected;
  const box = $('spec');
  if (!sel) { box.textContent = ''; box.append(el('p', { class: 'muted' }, 'Выберите узел или провод на схеме.')); return; }
  if (sel.type === 'node') {
    const n = S.idx.byId.get(sel.id);
    if (!n) { box.textContent = ''; return; }
    renderNodePanel(n);
  } else renderWirePanel(sel);
  box.scrollTop = 0;
}

/* ---------- левая панель: дерево и поиск ---------- */

function treeRow(id, depth) {
  const idx = S.idx;
  const n = idx.byId.get(id);
  const kids = idx.children.get(id);
  const open = S.treeOpen.has(id);
  const sel = S.selected && S.selected.type === 'node' && S.selected.id === id;
  const nf = idx.nodeFind.get(id);
  const off = S.hiddenLayers.has(idx.chain(id)[0]);
  const row = el('div', { class: 'tr' + (sel ? ' sel' : '') + (off ? ' off' : ''), style: 'padding-left:' + (depth * 14) + 'px', 'data-id': id },
    el('span', { class: 'arr' + (kids.length ? '' : ' none'), onclick: () => { if (!kids.length) return; if (open) S.treeOpen.delete(id); else S.treeOpen.add(id); renderTree(); } }, kids.length ? (open ? '▾' : '▸') : ''),
    el('span', { class: 'k' }, KIND_TITLES[n.kind] || n.kind),
    el('span', { class: 'nm', title: id, onclick: () => selectNode(id) }, n.name),
    kids.length ? el('span', { class: 'cnt' }, String(kids.length)) : '',
    nf && nf.ew ? el('span', { class: 'fd ' + (nf.error ? 'err' : 'warn') }, String(nf.ew)) : '');
  return row;
}

function treeAppend(parent, id, depth) {
  parent.append(treeRow(id, depth));
  if (!S.treeOpen.has(id)) return;
  const kids = S.idx.children.get(id);
  const cap = S.treeCap.get(id) || 150;
  for (const c of kids.slice(0, cap)) treeAppend(parent, c, depth + 1);
  if (kids.length > cap) {
    parent.append(el('div', { class: 'more', style: 'padding-left:' + ((depth + 1) * 14 + 20) + 'px', onclick: () => { S.treeCap.set(id, cap + 150); renderTree(); } }, 'ещё ' + (kids.length - cap) + '…'));
  }
}

function renderTree() {
  const idx = S.idx;
  const root = $('tree');
  root.textContent = '';
  if (S.query.trim()) {
    const r = searchNodes(idx, S.query, 120);
    root.append(el('div', { class: 'muted' }, 'найдено: ' + r.total + (r.total > r.items.length ? ' (показано ' + r.items.length + ')' : '')));
    for (const n of r.items) {
      root.append(el('div', { class: 'tr', title: n.id, onclick: () => selectNode(n.id) },
        el('span', { class: 'k' }, KIND_TITLES[n.kind] || n.kind), el('span', { class: 'nm' }, n.id)));
    }
    return;
  }
  for (const l of idx.roots) treeAppend(root, l, 0);
  const sel = root.querySelector('.tr.sel');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
}

/* ---------- таблица находок ---------- */

function findingsTable(groups) {
  const rows = [];
  for (const g of groups) {
    rows.push(el('tr', { class: 'rule' }, el('td', { colspan: 3 }, el('span', { class: 'sev ' + sevClass(g.sev) }), g.rule + ' \u2014 ' + (RULE_TITLES[g.rule] || ''), ' ', el('span', { class: 'muted' }, '(' + g.count + ')'))));
    for (const p of g.pairs) {
      rows.push(el('tr', { class: 'pair', onclick: () => selectPair(p.src_unit, p.dst_unit) },
        el('td', null, el('span', { class: 'sev ' + sevClass(p.sev) }), p.src_unit || '\u2014'),
        el('td', null, p.dst_unit ? '\u2192 ' + p.dst_unit : ''),
        el('td', null, String(p.count))));
    }
  }
  return el('table', { class: 'fnd' }, el('tr', null, el('th', null, 'Юнит-источник'), el('th', null, 'Юнит-приёмник'), el('th', null, 'Число')), rows);
}

// Таблица находок: error и warn сразу, info — свёрнутой группой ниже.
function renderFindingsDrawer() {
  const idx = S.idx;
  const body = $('drawer-body');
  body.textContent = '';
  $('drawer-title').textContent = 'Находки: ' + idx.F.length;
  if (!idx.F.length) { body.append(el('p', { class: 'muted' }, 'находок нет')); return; }
  const groups = groupFindings(idx);
  const main = groups.filter(g => g.sev >= 2);
  const info = groups.filter(g => g.sev < 2);
  body.append(main.length ? findingsTable(main) : el('p', { class: 'muted' }, 'ошибок и предупреждений нет'));
  if (info.length) {
    const n = info.reduce((a, g) => a + g.count, 0);
    body.append(el('details', { class: 'info' }, el('summary', null, 'Информационные (' + n + ')'), findingsTable(info)));
  }
}

/* ---------- верхняя панель ---------- */

function syncLayerMenu() {
  const menu = $('m-layers');
  if (!menu || !S.idx) return;
  menu.querySelectorAll('input').forEach(i => { i.checked = !S.hiddenLayers.has(i.value); });
}

function buildMenus() {
  const idx = S.idx;
  const mc = $('m-contour');
  mc.textContent = '';
  const vals = contourValues(idx);
  if (!vals.length) mc.append(el('div', { class: 'empty' }, 'контур не объявлен ни у одного юнита'));
  for (const c of vals) {
    mc.append(el('label', null, el('input', { type: 'checkbox', value: c, onchange: (ev) => {
      if (ev.target.checked) S.contours.add(c); else S.contours.delete(c);
      $('dd-contour').querySelector('summary').textContent = 'Контур: ' + (S.contours.size ? Array.from(S.contours).join(', ') : 'все');
      refreshStyles();
    } }), c));
  }
  const ml = $('m-layers');
  ml.textContent = '';
  for (const l of idx.roots) {
    ml.append(el('label', null, el('input', { type: 'checkbox', value: l, checked: true, onchange: (ev) => {
      if (ev.target.checked) S.hiddenLayers.delete(l); else S.hiddenLayers.add(l);
      render({ fit: true });
    } }), nodeTitle(idx, l)));
  }
}

function resetToUnits() {
  S.expanded = unitsExpanded(S.idx);
}

function bindBar() {
  const kinds = { hard: 'k-hard', lazy: 'k-lazy', tc: 'k-tc' };
  for (const k of Object.keys(kinds)) {
    $(kinds[k]).addEventListener('change', (ev) => { S.kinds[k] = ev.target.checked; render(); });
  }
  $('f-viol').addEventListener('change', (ev) => { S.onlyViol = ev.target.checked; render(); });
  $('b-focus').addEventListener('click', () => {
    S.focus = !S.focus;
    $('b-focus').classList.toggle('on', S.focus);
    render({ fit: S.focus || undefined });
  });
  $('b-collapse').addEventListener('click', () => { S.expanded = new Set(); S.selected = null; render({ fit: true }); });
  $('b-units').addEventListener('click', () => { resetToUnits(); render({ fit: true }); });
  $('b-layers').addEventListener('click', () => { S.expanded = new Set(); render({ fit: true }); });
  $('b-fit').addEventListener('click', () => S.cy.fit(undefined, 30));
  $('b-find').addEventListener('click', () => { setDrawer($('drawer').hidden); writeHash(); });
  $('b-drawer-close').addEventListener('click', () => { setDrawer(false); writeHash(); });
  // выпадающие меню закрываются кликом вне их
  document.addEventListener('click', (ev) => {
    for (const d of document.querySelectorAll('details.dd[open]')) if (!d.contains(ev.target)) d.removeAttribute('open');
  });
  const side = (btn, panel) => {
    $(btn).addEventListener('click', () => { $(panel).classList.toggle('hidden'); $(btn).classList.toggle('on', !$(panel).classList.contains('hidden')); });
  };
  side('b-left', 'left');
  side('b-right', 'right');
  $('search').addEventListener('input', (ev) => { S.query = ev.target.value; renderTree(); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') setSelection(null); });
  // узкий экран: панели свёрнуты, кнопки их выдвигают
  const mq = window.matchMedia('(max-width: 900px)');
  const apply = () => {
    for (const [p, b] of [['left', 'b-left'], ['right', 'b-right']]) {
      $(p).classList.toggle('hidden', mq.matches);
      $(b).classList.toggle('on', !mq.matches);
    }
  };
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
}

function renderHeader() {
  const m = S.idx.meta;
  const c = m.counts || {};
  const idx = S.idx;
  const units = c.units != null ? c.units : (idx.model.nodes || []).filter(n => n.kind === 'unit').length;
  const files = c.files != null ? c.files : (idx.model.nodes || []).filter(n => n.kind === 'file').length;
  const box = $('hdr-meta');
  box.textContent = '';
  box.append('коммит ', el('b', null, m.commit || '?'), ' · собрано ', el('b', null, m.generated || '?'),
    ' · юнитов ', el('b', null, String(units)), ' · файлов ', el('b', null, String(files)),
    ' · импортов ', el('b', null, String(c.edges != null ? c.edges : idx.E.length)),
    ' · находок ', el('b', null, String(c.findings != null ? c.findings : idx.F.length)));
}

/* ---------- запуск ---------- */

function boot() {
  const missing = [];
  if (typeof window.ARCH_MODEL === 'undefined') missing.push('model.js (window.ARCH_MODEL): файл не найден рядом со страницей или пуст. Запустите: python scripts/arch_map/build.py');
  if (typeof window.cytoscape === 'undefined') missing.push('cytoscape (cdnjs): библиотека не загрузилась. Нужен доступ в интернет к cdnjs.cloudflare.com.');
  if (missing.length) throw new Error('Страница не может построить схему:\n - ' + missing.join('\n - '));

  S.idx = buildIndex(window.ARCH_MODEL);
  if (!S.idx.roots.length) throw new Error('В модели нет узлов.');
  if (typeof window.ELK !== 'undefined') {
    try { S.elk = new window.ELK(); } catch (e) { console.error('ELK не создался', e); S.elk = null; }
  }

  S.cy = window.cytoscape({
    container: $('cy'), elements: [], style: buildStyle(),
    minZoom: 0.04, maxZoom: 3, wheelSensitivity: 0.25, autoungrabify: true, boxSelectionEnabled: false,
    textureOnViewport: false, pixelRatio: 'auto'
  });
  const cy = S.cy;

  // клик по узлу выбирает, двойной клик раскрывает/сворачивает (cytoscape своего dbltap не даёт — считаем сами)
  cy.on('tap', 'node', (ev) => {
    const id = ev.target.id();
    if (isAux(id)) return;
    const now = Date.now();
    if (S.lastTap.id === id && now - S.lastTap.t < 380) {
      S.lastTap = { id: null, t: 0 };
      toggleNode(id);
      return;
    }
    S.lastTap = { id, t: now };
    setSelection({ type: 'node', id });
  });
  cy.on('tap', 'edge', (ev) => {
    const e = ev.target;
    setSelection({ type: 'wire', src: e.source().id(), dst: e.target().id() });
  });
  cy.on('tap', (ev) => { if (ev.target === cy) setSelection(null); });

  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  if (dark.addEventListener) dark.addEventListener('change', () => cy.style(buildStyle()));

  // наведение: подсветка проводов узла; на проводе показывается его подпись
  cy.on('mouseover', 'node', (ev) => {
    const id = ev.target.id();
    if (isAux(id)) return;
    S.hover = id;
    refreshHighlight();
  });
  cy.on('mouseout', 'node', () => { S.hover = null; refreshHighlight(); });
  cy.on('mouseover', 'edge', (ev) => { ev.target.addClass('hl-out'); });
  cy.on('mouseout', 'edge', () => refreshHighlight());

  buildMenus();
  bindBar();
  renderHeader();
  renderFindingsDrawer();
  window.addEventListener('resize', () => cy.resize());
  // ручная правка адреса (#view=…) применяется на лету; наши собственные записи пропускаются
  window.addEventListener('hashchange', () => {
    if (typeof location !== 'undefined' && location.hash !== S.lastHash) applyHash();
  });
  applyHash();
}

if (typeof document !== 'undefined' && document.getElementById('fatal')) {
  try { boot(); } catch (e) { showFatal(e); }
}
</script>
</body>
