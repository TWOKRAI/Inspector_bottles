# CAPABILITIES.yaml — «контактная книжка» бэкенда (capability manifest v1).
# ГЕНЕРИРУЕТСЯ: python -m backend_ctl.dump_capabilities — руками не править.
# CI-gate: backend_ctl/tests/test_capabilities.py сверяет с runtime (дрейф = красный).
channels:
- kind: QueueChannel
  name: ProcessManager_data
- kind: QueueChannel
  name: ProcessManager_local
- kind: QueueChannel
  name: ProcessManager_observability
- kind: QueueChannel
  name: ProcessManager_state
- kind: QueueChannel
  name: ProcessManager_system
- kind: SocketChannel
  name: backend_ctl
processes:
  ProcessManager:
    commands:
    - description: 'Каталог плагинов для GUI: форма регистра (FieldInfo dict) + порты + команды, без plugin-кода'
      name: catalog.plugins
      tags:
      - system
    - description: Применить секции observability и/или telemetry (логи, sink'и, publisher-gate, троттл)
        на лету
      name: config.reload
      params_schema:
      - name: observability
        required: false
        type: Dict
      - name: observability_recipe
        required: false
        type: Dict
      - name: observability_recipe_path
        required: false
        type: str
      - name: observability_recipe_reload
        required: false
        type: bool
      - name: observability_reset
        required: false
        type: List
      - name: observability_session_clear
        required: false
        type: bool
      - name: path
        required: false
        type: str
      - name: persist
        required: false
        type: bool
      - name: telemetry
        required: false
        type: Dict
      - name: telemetry_mode
        required: false
        type: str
      - name: ttl
        required: false
        type: float
      tags:
      - system
    - description: 'Диагностика: поднять поток, бросающий RuntimeError — проверка threading.excepthook'
      name: diag.thread_raise
      params_schema:
      - name: message
        required: false
        type: str
      - name: thread_name
        required: false
        type: str
      tags:
      - diagnostics
      - system
    - description: 'Диагностика: позвать warnings.warn — проверка warnings.showwarning'
      name: diag.warn
      params_schema:
      - name: category
        required: false
        type: str
      - name: message
        required: false
        type: str
      tags:
      - diagnostics
      - system
    - description: ''
      name: flush_stats
      tags:
      - stats
    - description: ''
      name: get_metric
      tags:
      - stats
    - description: ''
      name: get_metrics
      tags:
      - stats
    - description: 'Диагностика: впрыснуть health-событие (report_error) — проверка канала наблюдаемости'
      name: health.report
      params_schema:
      - name: context
        required: false
        type: str
      - name: level
        required: false
        type: str
      - name: message
        required: false
        type: str
      - name: status
        required: false
        type: str
      tags:
      - health
      - system
    - description: Текущий снапшот здоровья процесса (status/errors/last_error)
      name: health.status
      tags:
      - health
      - system
    - description: 'Карточка процесса для «контактной книжки»: команды+descriptions, регистры (поля),
        router-handlers'
      name: introspect.capabilities
      tags:
      - system
    - description: 'Именованные исполнители процесса (ExecutorManager): тип, источник, владение, рабочие
        потоки'
      name: introspect.executors
      tags:
      - system
    - description: Router message-handlers + команды CommandManager процесса
      name: introspect.handlers
      tags:
      - system
    - description: 'Инвентарь памяти процесса: SHM/пул/очереди (статистика, чего нет даже у GUI)'
      name: introspect.memory
      tags:
      - system
    - description: 'Readback logger/error/stats: пороги и каналы + потери (buffer.dropped_by_channel,
        errors_to_floor)'
      name: introspect.observability
      params_schema:
      - name: audit_limit
        required: false
        type: int
      - name: flush
        required: false
        type: bool
      - name: resolve
        required: false
        type: str | List
      tags:
      - system
    - description: 'Каталог плагинов процесса: зарегистрированные + failed_imports (модули, упавшие на
        discover)'
      name: introspect.plugins
      tags:
      - system
    - description: Глубины очередей процесса (backpressure)
      name: introspect.queues
      tags:
      - system
    - description: Регистры процесса (имена + поля) из RegistersManager
      name: introspect.registers
      tags:
      - system
    - description: 'Счётчики router''а: sent_ok/received/dropped/errors (дошло ли сообщение)'
      name: introspect.router_stats
      tags:
      - system
    - description: Имя процесса, статус, воркеры (имена + статусы), cv_threads (потоки OpenCV, None без
        cv2)
      name: introspect.status
      tags:
      - system
    - description: 'Readback телеметрийного gate: эффективная publish-секция + per-метрика (enabled, interval)'
      name: introspect.telemetry
      tags:
      - system
    - description: Подписать адрес на LogRecord'ы процесса с level ≥ порога (router-push)
      name: log.tail.subscribe
      params_schema:
      - name: command
        required: false
        type: str
      - name: level
        required: false
        type: str
      - name: subscriber
        required: false
        type: str
      tags:
      - system
    - description: Снять подписку на tail логов процесса
      name: log.tail.unsubscribe
      params_schema:
      - name: subscriber
        required: false
        type: str
      - name: tap
        required: false
        type: str
      tags:
      - system
    - description: Алиас observability.sink.disable (имя до 5.10; охват тот же — три плоскости)
      name: logger.sink.disable
      params_schema:
      - name: manager
        required: false
        type: str
      - name: name
        required: false
        type: str
      - name: sink
        required: false
        type: str
      - name: ttl
        required: false
        type: float
      tags:
      - system
    - description: Алиас observability.sink.enable (имя до 5.10; охват тот же — три плоскости)
      name: logger.sink.enable
      params_schema:
      - name: manager
        required: false
        type: str
      - name: name
        required: false
        type: str
      - name: sink
        required: false
        type: str
      - name: ttl
        required: false
        type: float
      tags:
      - system
    - description: Алиас observability.sink.tail (имя до 5.10)
      name: logger.sink.tail
      params_schema:
      - name: limit
        required: false
        type: int
      - name: manager
        required: false
        type: str
      - name: name
        required: false
        type: str
      - name: sink
        required: false
        type: str
      tags:
      - system
    - description: Сохранить рантайм-правки наблюдаемости в спутник рецепта (слой L2)
      name: observability.persist
      params_schema:
      - name: recipe_path
        required: false
        type: str
      tags:
      - system
    - description: Выключить приёмник по имени на плоскости manager=logger|error|stats (unregister_channel)
      name: observability.sink.disable
      params_schema:
      - name: manager
        required: false
        type: str
      - name: name
        required: false
        type: str
      - name: sink
        required: false
        type: str
      - name: ttl
        required: false
        type: float
      tags:
      - system
    - description: Включить приёмник по имени на плоскости manager=logger|error|stats (register_channel)
      name: observability.sink.enable
      params_schema:
      - name: manager
        required: false
        type: str
      - name: name
        required: false
        type: str
      - name: sink
        required: false
        type: str
      - name: ttl
        required: false
        type: float
      tags:
      - system
    - description: Прочитать последние N записей приёмника, хранящего их у себя (type=memory)
      name: observability.sink.tail
      params_schema:
      - name: limit
        required: false
        type: int
      - name: manager
        required: false
        type: str
      - name: name
        required: false
        type: str
      - name: sink
        required: false
        type: str
      tags:
      - system
    - description: Подписать GUI-адрес на live-хвост наблюдаемости (log/stats/error → observability.record)
      name: observability.tail.subscribe
      params_schema:
      - name: level
        required: false
        type: str
      - name: scope
        required: false
        type: str
      - name: subscriber
        required: false
        type: str
      tags:
      - system
    - description: 'Брокер (Task 5.11): подписать адрес на хвост ВСЕХ процессов одним вызовом; намерение
        переживает рестарт, switch и появление нового процесса. Записи идут напрямую подписчику — PM брокер,
        не транзит'
      name: observability.tail.subscribe_all
      params_schema:
      - name: level
        required: false
        type: str
      - name: subscriber
        required: false
        type: str
      tags:
      - system
    - description: Снять подписку на live-хвост наблюдаемости процесса
      name: observability.tail.unsubscribe
      params_schema:
      - name: scope
        required: false
        type: str
      - name: subscriber
        required: false
        type: str
      tags:
      - system
    - description: 'Брокер: снять намерение подписчика и разослать снятие хвоста всем процессам'
      name: observability.tail.unsubscribe_all
      params_schema:
      - name: level
        required: false
        type: str
      - name: subscriber
        required: false
        type: str
      tags:
      - system
    - description: 'Router endpoint: вложенная команда PM'
      name: process.command
      tags:
      - system
    - description: Создать процесс из inline-конфига
      name: process.create
      tags:
      - system
    - description: Список всех процессов и статусов
      name: process.list
      tags:
      - system
    - description: Поставить процесс на паузу
      name: process.pause
      tags:
      - system
    - description: 'Relay: доставить команду в целевой процесс через свежий PSR PM'
      name: process.relay
      tags:
      - system
    - description: Перезапустить именованный процесс
      name: process.restart
      tags:
      - system
    - description: Возобновить процесс
      name: process.resume
      tags:
      - system
    - description: Запустить именованный процесс
      name: process.start
      tags:
      - system
    - description: Статус именованного процесса
      name: process.status
      tags:
      - system
    - description: Остановить именованный процесс
      name: process.stop
      tags:
      - system
    - description: ''
      name: reset_metrics
      tags:
      - stats
    - description: Переслать недоставляемый push-билет своим router'ом (хаб-релей к внешним подписчикам)
      name: router.relay
      params_schema:
      - name: ticket
        required: false
        type: Dict
      tags:
      - system
    - description: 'Диагностика: отправить inner-билет соседу (peer→peer доставка после switch)'
      name: routing.probe
      params_schema:
      - name: inner
        required: false
        type: Dict
      - name: target
        required: false
        type: str
      tags:
      - system
    - description: 'Сверка снимка routing-epoch: сброс стейл-очередей соседей (Ф3.1)'
      name: routing.refresh
      params_schema:
      - name: epoch
        required: false
        type: int
      - name: hub
        required: false
        type: str
      - name: processes
        required: false
        type: Dict
      - name: reason
        required: false
        type: str
      - name: ts
        required: false
        type: float
      tags:
      - system
    - description: 'Хост сервисов (ADR-SVC-004): service.list'
      name: service.list
      tags:
      - system
    - description: 'Хост сервисов (ADR-SVC-004): service.restart'
      name: service.restart
      tags:
      - system
    - description: 'Хост сервисов (ADR-SVC-004): service.start'
      name: service.start
      tags:
      - system
    - description: 'Хост сервисов (ADR-SVC-004): service.status'
      name: service.status
      tags:
      - system
    - description: 'Хост сервисов (ADR-SVC-004): service.stop'
      name: service.stop
      tags:
      - system
    - description: Удалить узел/поддерево по пути
      name: state.delete
      tags:
      - state_store
    - description: Прочитать значение из дерева
      name: state.get
      tags:
      - state_store
    - description: Прочитать поддерево
      name: state.get_subtree
      tags:
      - state_store
    - description: Глубокий merge dict в поддерево
      name: state.merge
      tags:
      - state_store
    - description: Установить значение в дереве
      name: state.set
      tags:
      - state_store
    - description: Подписаться на изменения
      name: state.subscribe
      tags:
      - state_store
    - description: Отписаться от подписки
      name: state.unsubscribe
      tags:
      - state_store
    - description: Отписать все подписки процесса
      name: state.unsubscribe_all
      tags:
      - state_store
    - description: ''
      name: stats_snapshot
      tags:
      - diagnostics
      - stats
    - description: 'Supervision-снимок: epoch + per-process incarnation/restart_count/last_exit/status/pid/started_at/instance_restarts.
        Маркер замены инстанса = pid+instance_restarts (считает и ручные, и авто-рестарты supervision
        — они идут той же process.restart). incarnation растёт только при смене identity очередей; restart_count
        — краш-рестарты монитора'
      name: supervision.status
      tags:
      - system
    - description: Завершить систему
      name: system.shutdown
      tags:
      - system
    - description: Статистика системы
      name: system.stats
      tags:
      - system
    - description: 'Телеметрия через PM: publish → всем детям (fan-out) ИЛИ адресно (data.target), throttle
        → центральный троттл оркестратора; cap-детекция на обоих путях'
      name: telemetry.broadcast
      tags:
      - system
    - description: 'Рантайм-переконфигурация телеметрии: publisher-gate (publish) и/или троттл (throttle)'
      name: telemetry.reconfigure
      params_schema:
      - name: publish
        required: false
        type: Dict
      - name: telemetry_mode
        required: false
        type: str
      - name: throttle
        required: false
        type: Dict
      - name: ttl
        required: false
        type: float
      tags:
      - system
    - description: Применить топологию процессов
      name: topology.apply
      tags:
      - system
    - description: Вычислить diff топологии (dry-run)
      name: topology.diff
      tags:
      - system
    - description: Получить текущую топологию
      name: topology.get
      tags:
      - system
    - description: Настроить wire middleware (SHM sender/receiver)
      name: wire.configure
      params_schema:
      - name: buffer_slots
        required: false
        type: int
      - name: role
        required: false
        type: str
      - name: shm_name
        required: false
        type: str
      - name: shm_owner
        required: false
        type: str
      - name: wire_key
        required: false
        type: str
      tags:
      - system
    - description: Удалить wire middleware
      name: wire.deconfigure
      params_schema:
      - name: wire_key
        required: false
        type: str
      tags:
      - system
    - description: Настроить wire-канал (SHM + routes)
      name: wire.setup
      tags:
      - system
    - description: Статусы wire-каналов
      name: wire.status
      tags:
      - system
    - description: Разобрать wire-канал
      name: wire.teardown
      tags:
      - system
    - description: Создать воркер в процессе
      name: worker.create
      params_schema:
      - name: config
        required: false
        type: Dict
      - name: execution_mode
        required: false
        type: str
      - name: max_restarts
        required: false
        type: int
      - name: priority
        required: false
        type: str
      - name: restart_on_failure
        required: false
        type: bool
      - name: target_interval_ms
        required: false
        type: int
      - name: worker_class
        required: false
        type: str
      - name: worker_name
        required: false
        type: str
      - name: worker_type
        required: false
        type: str
      tags:
      - system
    - description: Дренаж воркера (пауза+дождаться кадра); remove=True → drain→detach→stop
      name: worker.drain
      tags:
      - system
    - description: Поставить все прикладные воркеры процесса на паузу
      name: worker.pause_all
      tags:
      - system
    - description: Удалить воркер из процесса
      name: worker.remove
      params_schema:
      - name: worker_name
        required: false
        type: str
      tags:
      - system
    - description: Перезапустить воркер
      name: worker.restart
      params_schema:
      - name: worker_name
        required: false
        type: str
      tags:
      - system
    - description: Возобновить все прикладные воркеры процесса
      name: worker.resume_all
      tags:
      - system
    - description: Запустить остановленный воркер
      name: worker.start
      params_schema:
      - name: worker_name
        required: false
        type: str
      tags:
      - system
    - description: Остановить воркер (без удаления)
      name: worker.stop
      params_schema:
      - name: worker_name
        required: false
        type: str
      tags:
      - system
    - description: Перенастроить воркер (приоритет/интервал)
      name: worker.update
      params_schema:
      - name: config
        required: false
        type: Dict
      - name: execution_mode
        required: false
        type: str
      - name: max_restarts
        required: false
        type: int
      - name: priority
        required: false
        type: str
      - name: restart_on_failure
        required: false
        type: bool
      - name: target_interval_ms
        required: false
        type: int
      - name: worker_class
        required: false
        type: str
      - name: worker_name
        required: false
        type: str
      - name: worker_type
        required: false
        type: str
      tags:
      - system
    registers: {}
    router_handlers:
    - heartbeat
