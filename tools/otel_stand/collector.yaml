# Стенд-арбитр этапа 7 (otel-export, Task 0.1).
#
# Это НЕ эксплуатационный приёмник и не мониторинг. Единственная его роль —
# внешний потребитель, который разберёт наши записи и тем самым проверит, что
# словарь полей Ф3 настоящий, а не заявленный. Границы того, что этот арбитр
# способен опровергнуть, названы в README — выводы приёмки ими ограничены.
#
# Дистрибутив: otelcol (ядро), НЕ otelcol-contrib. Приёмник otlp и экспортёры
# debug/file собраны в ядро — проверено `otelcol.exe components`.
#
# Запуск (из корня репозитория, чтобы относительный путь file-экспортёра сошёлся):
#   <путь>/otelcol.exe --config tools/otel_stand/collector.yaml
# Путь к бинарнику — в README, в репозиторий он не кладётся.

receivers:
  otlp:
    protocols:
      http:
        # Только петля. Выход в сеть — не задача стенда: на Jetson/Raspberry
        # коллектор не ставится вовсе, туда едет только адрес из конфига рецепта.
        endpoint: 127.0.0.1:4318

exporters:
  # Человеку — глазами, в консоль коллектора.
  debug:
    verbosity: detailed

  # Машине — то, что предъявляется в приёмке 4.1 целиком, а не пересказом.
  # logs_live/ игнорируется git'ом (.gitignore:62) — файл в репозиторий не уедет.
  file:
    path: logs_live/otel_records.json

service:
  pipelines:
    # Только логи. Метрики и трейсы — out of scope всего плана.
    logs:
      receivers: [otlp]
      exporters: [debug, file]

  telemetry:
    logs:
      # Собственные жалобы коллектора нужны в полном виде: отказ приёма
      # предъявляется в контроле №2 его же голосом.
      level: info
