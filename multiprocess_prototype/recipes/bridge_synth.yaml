# Рецепт bridge_synth — стенд моста кадров (gui-service Task 1.3, L1–L6).
#
# Тракт: synthetic_source[synthetic_frame_source] → gui (chain_targets).
# `gui` объявлен headless (как в остальных рецептах); класс моста подставляет overlay:
#   BACKEND_CTL=1 BACKEND_CTL_PORT=88xx \
#   INSPECTOR_PRESENTATION=multiprocess_prototype/frontend/presentation_bridge.yaml \
#     python multiprocess_prototype/run.py bridge_synth
# Без overlay'я — обычный headless-дренаж (дескрипторы не строятся).
# НЕ прод-рецепт: только для живого стенда моста.
name: bridge_synth
version: 1
description: "Synthetic source 30 fps → gui (мост кадров, стенд Task 1.3)"

blueprint:
  name: bridge_synth
  description: "Синтетический источник кадров → gui (headless/мост)"

  processes:
    - process_name: synthetic_source
      process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
      priority: high
      chain_targets:
        - gui
      source_target_fps: 30
      plugins:
        - plugin_class: Plugins.sources.synthetic_frame_source.plugin.SyntheticFrameSourcePlugin
          plugin_name: synthetic_frame_source
          category: source
          camera_id: 0
          resolution_width: 640
          resolution_height: 480

    - process_name: gui
      plugins: []
      workers: []
      process_class: multiprocess_prototype.frontend.headless_process.HeadlessGuiProcess
      chain_targets: []
      protected: true

  wires: []
