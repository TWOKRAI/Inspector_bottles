# Inspector Bottles v2 — системные defaults
# Topology JSON (topology/*.json) описывает СТРУКТУРУ (процессы, плагины, wires).
# Этот файл описывает ЗНАЧЕНИЯ по умолчанию для всех плагинов.
# Плагин в topology может override любое поле — здесь только базовые defaults.

# --- Системные параметры ---
system:
  stop_timeout: 5.0           # таймаут graceful shutdown (сек)
  shm_budget_mb: 512          # лимит общей SHM-памяти
  log_dir: "logs/prototype_2"  # относительно cwd, каждый процесс → подпапка

# --- Камеры (defaults для capture-плагинов) ---
camera:
  source_type: simulator      # simulator | webcam | hikvision | file
  fps: 25
  resolution_width: 640
  resolution_height: 480
  ring_buffer_size: 3

# --- Обработка ---
processing:
  worker_pool_size: 0         # 0 = пул отключён

# --- Дисплей ---
display:
  enabled: true

# --- Хранение ---
storage:
  db_path: data/inspector.db
  batch_size: 100

# --- Backend-control сокет (dev-инструмент: BackendDriver / MCP) ---
# enabled: true → ProcessManager поднимает TCP-endpoint на host:port (localhost).
# Через него headless-driver шлёт те же router-команды, что GUI (отладка бэкенда
# без GUI/qt-mcp). В проде ставить false. Env BACKEND_CTL=1 включает независимо.
backend_ctl:
  enabled: true
  port: 8765
  host: "127.0.0.1"

# --- Наблюдаемость (единая секция: Logger + Error + Stats) ---
# Управляет всеми тремя менеджерами наблюдаемости каждого процесса (overlay поверх
# дефолтов фреймворка). Правка этой секции — точка для hot-reload (Phase 3.3).
# log_directory не задан → используется system.log_dir выше.
observability:
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR | CRITICAL
  console: true            # консольный sink
  file: true               # файловые sink-каналы

  # --- Плоскость документов (Ф8.5) -------------------------------------------
  # Второе правило допуска: запись, чья ценность не выражается severity (смена
  # настройки — INFO, но нужна через год), получает СВОЙ приёмник вместо фильтра
  # по уровню. Фреймворк знает отсюда только строку `factory` — реализацию
  # приносит `Services` (правило слоёв 9: фреймворк не импортирует Services).
  # Пустая `factory` → плоскости нет, аудит живёт кольцом и строками журнала.
  # Файл БД — НЕ в каталоге логов намеренно: у логов свой ретеншен (7 дней /
  # 200 МБ), и документ, положенный рядом, однажды уедет вместе с ними.
  documents:
    factory: "Services.documents.wiring:make_document_sink"
    config:
      db_path: data/documents.db
      # Срок per-kind, ПО ВРЕМЕНИ. Рода, которого здесь нет, уборка не трогает
      # никогда: молчание конфига не является разрешением потерять документ.
      retention_sec:
        audit: 31536000      # год — смены настроек спрашивают при разборе инцидента
        verdict: 315360000   # десять лет — вердикт о качестве изделия
      purge_interval_sec: 3600   # такт уборки (исполняет heartbeat процесса)

  # --- Раскладка логов по файлам (Ф2.6) --------------------------------------
  # Приёмники и правила живут ЗДЕСЬ, а не во фреймворке: фреймворк владеет
  # именами своих источников, приложение — тем, где на диске лежат его файлы
  # (решение владельца Р-2.6-Г). До Ф2.6 девять per-module файлов приезжали из
  # дефолта фреймворка и создавались в каталоге каждого процесса: 384 файла на
  # прогон, непустых 4.
  # `name_max_len` — потолок длины имени источника В ВЫВОДЕ (Ф2.6). Задаётся у
  # КАЖДОГО приёмника явно: схема по умолчанию печатает имя целиком, и прикладной
  # канал НЕ наследует настройку фреймворковых. Найдено живым прогоном 2026-08-04:
  # system.log печатал `m.m.command_module`, а busy.log — полное
  # `multiprocess_framework.modules.command_module`, и это давало **+19.2%** к весу
  # самого объёмного файла (6552 Б из 34083 за 50 секунд). Тесты этого не видели:
  # каждый проверял свой канал, а расхождение между каналами видно только рядом.
  channels:
    # Прикладная диагностика прототипа. Раньше приезжала ключами `gui`/`trace`
    # из дефолта фреймворка — то есть прикладные имена были прибиты в
    # универсальной части. Писатели у обоих в multiprocess_prototype/frontend/.
    gui_file:
      type: file
      name_max_len: 20
      file_path: gui.log
    trace_file:
      type: file
      name_max_len: 20
      file_path: trace.log
    # Служебная болтовня фреймворка. Замер 2026-08-03 по весу system.log:
    # command_manager 17.4% + dispatcher 15.0% у ProcessManager, 28.9% + 27.6%
    # у region_splitter. Уводим из системного лога, чтобы в нём осталось то,
    # ради чего его открывают после инцидента.
    busy_file:
      type: file
      name_max_len: 20
      file_path: busy.log

  # --- Ярлыки источников (Ф2.5) ------------------------------------------------
  # Модель `logging.group.*` Spring Boot: имя набора префиксов. Правило пишется
  # на ярлык и раскрывается по каждому члену при сборке дерева — резолв о группах
  # не знает, горячий путь за них не платит. Ключи — полные точечные имена: члены
  # остаются обычными префиксами, и поддерево каждого наследует правило само.
  logger_groups:
    служебное:
      - multiprocess_framework.modules.command_module
      - multiprocess_framework.modules.dispatch_module
      - multiprocess_framework.modules.shared_resources_module.queues

  loggers:
    # `channels_extra` — «И свой файл, И унаследованный набор». Ровно то, что
    # делал снятый механизм per-module файлов: он ДОБАВЛЯЛ свой канал к каналам
    # скоупа. Через `channels` (замещение) поведение молча изменилось бы: файл
    # остался бы непустым, а из system.log записи исчезли.
    gui:
      channels_extra: [gui_file]
    trace:
      channels_extra: [trace_file]
    # `channels` — замещение: увести совсем, иначе разгрузки не будет.
    # Правка одна на всю группу (Ф2.5). До неё здесь стояли ДВЕ строки с
    # одинаковым телом: набор «служебная болтовня» существовал в голове
    # оператора, а в конфиге его не было — поэтому и переписывался покомпонентно.
    служебное:
      channels: [busy_file]
  # --- Ретеншен (Ф6.9). Раньше обе политики оставались нулями фреймворка, и
  # чистка была выключена по умолчанию: 471 МБ в logs/ и ноль удалений на
  # живом прогоне 2026-08-03. Включать её ДО миграции 116 файлов — сознательно:
  # иначе 201 точка warning просыпается при выключенном ретеншене, то есть
  # воспроизводит условия инцидента 645 МБ.
  #
  # Арифметика порогов от замера «до»: 5.4 МБ/час суммарно по восьми процессам
  # ≈ 130 МБ/сут, то есть ~16 МБ/сут на процесс. Потолок задаётся НА КАТАЛОГ
  # ПРОЦЕССА (logs/<процесс>/), а не на всё дерево: подметает каждый менеджер
  # свой каталог. 200 МБ — примерно двенадцать суток нынешнего темпа, то есть
  # запас на кратный рост объёма после миграции и всё ещё жёсткий предел.
  retention_days: 7
  retention_total_mb: 200
  retention_sweep_interval_sec: 3600   # 0 — мести только на старте и на reconfigure
  errors:
    enabled: true
    level: WARNING
    include_stacktrace: true
  stats:
    enabled: true
    # B1 (2026-08-09): здесь стояло 5.0 — и НЕ ДЕЙСТВОВАЛО НИ РАЗУ. Темп записи =
    # max(flush_interval, aggregation_interval), а пол flush_interval по умолчанию
    # 10.0, так что фактические сбросы всегда шли раз в 10 с. Написанное значение
    # обязано совпадать с действующим, иначе конфиг врёт молча — ровно то, что
    # закрывает задача B1 (major-3). Темп изменился на ноль: было 10.0, стало 10.0.
    # Хотите чаще — опускайте ПОЛ (flush_interval), не это число; действующий темп
    # виден в introspect.observability -> effective.stats.aggregation_interval.
    aggregation_interval: 10.0
    log_level: INFO

# --- Телеметрия (PC 1.3/2.1, план plans/telemetry-publish-control.md) ---
# Две независимые плоскости StateStore. Errors/status — публикуются ВСЕГДА, ни
# publish, ни throttle ими не управляют (полный список — ниже).
#
# publish — publisher-gate (Фаза 1, ГЛАВНЫЙ рычаг): какие метрики процесс СЧИТАЕТ
# и публикует в дерево StateStore и как часто (per-метрика вкл/выкл + интервал).
# per-process override — в blueprint.processes[].telemetry конкретного рецепта
# (мержится deep_merge'ом поверх этих значений — default_enabled из рецепта,
# не тронувшего этот ключ, НЕ стирается, ADR-PM-039).
#
# СЕКЦИЯ НИЖЕ ДЕЙСТВУЕТ, default_enabled: false — исполненный флип РТ-2
# (plans/telemetry-stage6.md, 2026-08-18, ADR-PM-040). Push уровней в дерево
# StateStore погашен для ВСЕХ процессов по умолчанию. Числа никуда не делись —
# GUI живёт ОПРОСОМ (introspect.telemetry → levels, TelemetryPoller, раз в секунду),
# опрос этой секцией не гейтуется вовсе. Включить публикацию конкретной метрики
# обратно — явным metrics.<имя>.enabled: true; ниже metrics пуст — белого списка
# нет, push'ом не публикуется НИЧЕГО.
#
# Этой секцией НЕ управляются (публикуются всегда, минуя publisher-gate):
# status, error, pid, uptime, paused, frozen — это ЛИСТЬЯ state.
# Мимо гейта идут и ЦЕЛЫЕ плоскости, не только листья (уточнено по находке ревью
# 2026-08-18, прежний текст обещал «полный список» и им не был):
#   - processes.<p>.plugins.<plugin>.io_peek — пишется плагинным зондом напрямую
#     через StateProxy (Plugins io_peek), при закрытом гейте измерено 13.6 дельт/с;
#   - processes.<p>.state.uptime — пишет ProcessMonitor внутри ProcessManager про
#     ЧУЖИЕ процессы, и рантайм-команда telemetry.reconfigure с process='all' до
#     оркестратора не доходит вовсе (fan-out = семь ДЕТЕЙ), 16 дельт/с;
#   - devices.state.<устройство>.* — плоскость device-hub, 4 дельты/с.
# Практический вывод: «закрытый гейт = ноль телеметрийного трафика» неверно для
# ВСЕЙ плоскости уровней и верно только для путей, которыми гейт владеет.
#
# ЦЕНА флипа, которую надо знать оператору (замерено 2026-08-18):
#   - гаснет 32 пути: fps, latency_ms, shm.*, frame_count, effective_hz,
#     cycle_duration_ms по пяти работающим процессам;
#   - гаснет ПРОИЗВОДНАЯ system.health.avg_fps, которой нет ни в одном каталоге
#     процесса: она считается из fps детей и умирает следствием;
#   - числа не пропадают — они приходят ОПРОСОМ (introspect.telemetry -> levels),
#     и множество «что опрос не отдаёт» с множеством «что гасит гейт» не пересекается.
#
# default_enabled (ADR-PM-039) — что делать с метрикой, для которой в metrics нет
# правила: true (схемный дефолт класса TelemetryPublishConfig) — включена с
# default_interval_sec; false (значение НИЖЕ, флип РТ-2) — секция становится
# белым списком, включают только явные metrics.<имя>.enabled=true.
# ВНИМАНИЕ (находка ревью Б1, 2026-08-18): telemetry.reconfigure/config.reload в
# режиме по умолчанию (replace) без default_enabled в теле возвращают его к true —
# флип переживает только правки с telemetry_mode: merge либо повторяющие
# default_enabled: false явно (README.md модуля, раздел default_enabled).
#
# Пример СИНТАКСИСА точечного override (НЕ действующая конфигурация — metrics
# в активной секции ниже пуст; так выглядела бы точечная настройка одной-двух
# метрик, если бы понадобилась вместо полного флипа):
#   metrics:
#     fps:               {enabled: true,  interval_sec: 1.0}
#     latency_ms:        {enabled: true,  interval_sec: 1.0}
#     effective_hz:      {enabled: true,  interval_sec: 1.0}
#     cycle_duration_ms: {enabled: false}                      # тяжёлая метрика — opt-in
#     shm:               {enabled: true,  interval_sec: 5.0}
#
# throttle — центральный store-троттл (Фаза 2, IPC-страховка вторым рубежом):
# {glob_pattern: min_interval_sec} для ThrottleMiddleware StateStoreManager.
# Флип РТ-2 throttle НЕ трогает — подсекция ниже остаётся закомментированной.
# Заданный (непустой) throttle ПОЛНОСТЬЮ ЗАМЕНЯЕТ хардкод-дефолты
# build_throttle_rules (не мержится поверх них) — сейчас это ВОСЕМЬ правил
# (_default_throttle_rules, multiprocess_prototype/backend/state/manager_setup.py:48-64 —
# путь полный намеренно: файлов с этим именем в дереве пять); закомментированный пример
# ниже содержит только ТРИ, и раскомментирование сузило бы центральный троттл
# с восьми дефолтных правил до этих трёх. Пусто/отсутствует → прежние восемь
# хардкод-дефолтов.
telemetry:
  publish:
    default_enabled: false
    default_interval_sec: 1.0
    metrics: {}
#   throttle:
#     # строгий потолок: поднятие частоты через publisher выше него всплывёт как
#     # `capped_by_throttle` в результате команды, троттл не срежет тихо (ADR-PM-017)
#     "processes.**.state.fps": 1.0
#     "processes.**.state.latency_ms": 1.0
#     "processes.**.workers.*.effective_hz": 1.0

# --- Автообнаружение плагинов и сервисов ---
discovery:
  plugin_paths:
    - "Plugins"
    - "Services"   # плагины внутри Service-пакетов (напр. Services/modbus/plugin/plugin.py)
  service_paths:
    - "Services"
  auto_discover: true
