# base.yaml — ФУНДАМЕНТ (приватная топология, headless-only).
#
# Базовые always-on процессы инфраструктуры, которые есть ВСЕГДА и НЕ участвуют
# в pipeline. Процесс презентации ``gui`` здесь НЕ объявляется: он — узел
# рецепта, как любой другой (план D8, 2026-08-09). Рецепт объявляет его в
# headless-воплощении (``frontend.headless_process.HeadlessGuiProcess``), а
# презентационный overlay ``multiprocess_prototype/frontend/presentation.yaml``
# ПОДМЕНЯЕТ ему класс на Qt-шный.
#
# При запуске фундамент СУММИРУЕТСЯ с активным pipeline (см. launch.merge_topologies):
#   merged.processes = base.processes + pipeline.processes
# Затем, если презентация включена, поверх накладывается overlay-ПАТЧ
# (``launch.apply_presentation_overlay``) — см. SystemBuilder.from_manifest.
#
# Правило «адрес обязан быть объявлен» (D8): ``chain_targets``/``wires``, ведущие
# в процесс, которого нет в СЛИТОЙ топологии, отвергаются сборкой с адресом ключа.
# До этого правила такой адрес давал отказ доставки на каждый кадр молча —
# 1418 отказов за 30 с на стенде ``webcam_sketch``.
#
# Оркестратор (ProcessManagerProcessApp) — процесс-хозяин, добавляется лончером
# отдельно (orchestrator_class_path), здесь не объявляется.

name: base
description: "Фундамент: always-on инфра (headless, без презентации)"

processes:
  - process_name: devices
    protected: true
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    plugins:
      - plugin_class: Plugins.hub.device_hub.plugin.DeviceHubPlugin
        plugin_name: device_hub
        category: hub
        registry_path: data/devices.yaml

  # --- Сток истории телеметрии: подписка на processes.** → семпл → SQLite ---
  #
  # Здесь, в фундаменте, а не в pipeline: история наблюдаемости нужна ЛЮБОЙ
  # сборке, а не одной демо-топологии. До 2026-08-23 сток жил только в
  # ``topology/telemetry_sink.yaml``, и на боевой сборке любой вопрос «что было
  # со стоком» был непроверяем по построению — таблицы ``telemetry_snapshots``
  # в БД просто не существовало (обнаружено на стенде Ф2: искали пару чисел
  # «до/после» по строкам БД и не нашли самих строк).
  #
  # Side-effect процесс: не участвует в потоке кадров (нет inputs/outputs),
  # только читает дерево StateStore и пишет в SQLite. priority: low —
  # чтобы семпл не конкурировал с кадровым трактом.
  #
  # ВНИМАНИЕ, цена названа: сток пишет то, что ЕДЕТ В ДЕРЕВО push'ом, а
  # publisher-gate по умолчанию закрыт (``telemetry.publish.default_enabled:
  # false``, белый список — fps/latency_ms). Плагинные метрики в строки БД
  # не попадут, пока их имена не открыты явно. Пустой ``extra`` — это
  # закрытый гейт, а НЕ поломка стока.
  #
  # ─────────────────────────────────────────────────────────────────────────
  # ОТКЛЮЧЁН до починки ГОЛОДАНИЯ ПОДПИСЧИКА (framework-дефект, не стока).
  #
  # ВНИМАНИЕ, здесь стояло уверенное НЕВЕРНОЕ объяснение (2026-08-23, снято
  # тем же днём расследованием). Оно звучало так: «строки все пустые, ни одной
  # дельты процесс не получает, сломан входящий трафик, похоже на switch не
  # раздал слой». Ни одно из четырёх утверждений не подтвердилось. Запись
  # оставлена, а не стёрта: ошибка была в ЧТЕНИИ симптома — `fps=None` и
  # пустой `extra` прочитаны как «ничего не приходит», хотя верное чтение —
  # «приходит, но 92 % выбрасывается по дороге».
  #
  # ЧТО НА САМОМ ДЕЛЕ (воспроизведено двумя прогонами, счётчики сошлись):
  #   * строки НЕ пустые — `uptime_s` заполнен у всех 9 процессов и растёт;
  #     плагин не пишет строку при пустом кэше вовсе, значит подписка жива;
  #   * `fps` доходит, но через 16 МИНУТ (camera_0: старт 18:50, первое
  #     значение 19:06); у `lines` и `pult` за 22 минуты — ни разу;
  #   * команды доходят и ВЫПОЛНЯЮТСЯ (`command.execution.success` на
  #     introspect.memory / introspect.observability), с опозданием в минуты;
  #   * merge фундамента и `protected: true` НЕ ПРИ ЧЁМ — оба опровергнуты
  #     (routing_epoch: 0, switch'а на буте нет; флип protected даёт тот же
  #     отказ бит-в-бит).
  #
  # КОРНЕВАЯ ПРИЧИНА — во фреймворке: `StateProxy._resync()` делает
  # блокирующий `router.request()` на ТОМ ЖЕ потоке, который обязан разобрать
  # ответ. Контракт нарушен буквально — он записан в докстринге вызываемого
  # метода (`router_module/core/router_manager.py`: «нельзя вызывать из того
  # же потока, который крутит receive() — ответ некому будет разобрать»).
  # Таймаут 5 с. Дальше петля: очередь `*_state` класса drop_oldest →
  # подписчик не успевает → дыра в revision → resync → 5 с простоя приёмного
  # цикла → ещё больше вытеснений. Замерено: вытеснено 93.7 % и 91.8 % в двух
  # прогонах; «лишняя» системная почта (опоздавшие ответы resync) приходит
  # раз в 5.06 с и 4.8 с — отпечаток того самого таймаута.
  #
  # Демо-топология `topology/telemetry_sink.yaml` работает не из-за способа
  # сборки, а из-за ОБЪЁМА: 2 процесса против 9 — ниже порога переполнения.
  #
  # Включать обратно ТОЛЬКО после починки resync (три пункта — в отчёте
  # расследования: resync не по приёмному потоку; исполняемая проверка
  # контракта request() вместо комментария; subscribe(sync=False) либо
  # message_processor до старта плагинов). Критерий приёмки — строка camera_0
  # с непустым fps в ПЕРВУЮ минуту, а не через шестнадцать.
  # ─────────────────────────────────────────────────────────────────────────
  #
  # - process_name: telemetry_sink
  #   process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
  #   priority: low
  #   plugins:
  #     - plugin_class: Plugins.io.telemetry_sink.plugin.TelemetrySinkPlugin
  #       plugin_name: telemetry_sink
  #       category: output
  #       db_path: data/telemetry.db
  #       sample_interval_sec: 5.0

wires: []
