# inspection_basic — Базовая инспекция
#
# Pipeline:
#   camera_0    — CameraServicePlugin (simulator) → BGR-кадры @ 25 fps
#   processor   — ColorMaskPlugin (HSV-маска) + BlobDetectorPlugin (контуры)
#   renderer    — RenderOverlayPlugin (alpha blending маски + bbox)
#   gui         — отображение результата
#
# Запуск:
#   python multiprocess_prototype/run.py multiprocess_prototype/backend/topology/inspection_basic.yaml

name: inspection_basic
description: "Базовая инспекция: камера → HSV-маска → детекция → overlay → GUI"

processes:
  # Презентация: объявляется ЗДЕСЬ, в headless-воплощении. presentation-overlay
  # подменяет класс на Qt-шный (frontend/presentation.yaml). Адрес, который никто
  # не объявил, отвергается сборкой — см. SystemBlueprint._unaddressable_chain_targets.
  - process_name: gui
    protected: true
    process_class: multiprocess_prototype.frontend.headless_process.HeadlessGuiProcess
    plugins: []

  # --- Камера: захват кадров через simulator backend ---
  - process_name: camera_0
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    priority: high
    chain_targets:
      - processor
    source_target_fps: 25
    plugins:
      - plugin_class: Plugins.sources.camera_service.plugin.CameraServicePlugin
        plugin_name: camera_service
        category: source
        camera_type: simulator
        camera_id: 0
        resolution_width: 640
        resolution_height: 480
        auto_start: true

  # --- Процессор: HSV-маска + детекция контуров ---
  - process_name: processor
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    priority: normal
    chain_targets:
      - renderer
    plugins:
      # Шаг 1: HSV-фильтрация (весь диапазон — принимает всё)
      - plugin_class: Plugins.processing.color_mask.plugin.ColorMaskPlugin
        plugin_name: color_mask
        category: processing
        h_min: 0
        h_max: 179
        s_min: 50
        s_max: 255
        v_min: 50
        v_max: 255
      # Шаг 2: Детекция контуров по маске
      - plugin_class: Plugins.processing.blob_detector.plugin.BlobDetectorPlugin
        plugin_name: blob_detector
        category: processing
        min_area: 100
        max_area: 0
        # Контуры рисует render_overlay (draw_detections); здесь — без копии кадра.
        draw_contours: false

  # --- Рендерер: наложение маски и bbox на кадр ---
  - process_name: renderer
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    priority: normal
    chain_targets:
      - gui
    plugins:
      - plugin_class: Plugins.render.render_overlay.plugin.RenderOverlayPlugin
        plugin_name: render_overlay
        category: processing
        mask_alpha: 0.5
        draw_detections: true

# Port-level разводка (SystemBlueprint.check() считает ключи по ИМЕНИ порта на уровне
# процесса: имя из провода или выход узла выше). Образец — inspection_full.yaml.
wires:
  # Камера → обработка. color_mask кладёт mask(gray) в item внутри процесса processor;
  # blob_detector берёт её оттуда (на графе провода нет), кадр — напрямую с камеры.
  - source: camera_0.camera_service.frame
    target: processor.color_mask.frame
  - source: camera_0.camera_service.frame
    target: processor.blob_detector.frame
  # Детекция → overlay (кадр + маска + детекции)
  - source: processor.blob_detector.frame
    target: renderer.render_overlay.frame
  - source: processor.blob_detector.mask
    target: renderer.render_overlay.mask
  - source: processor.blob_detector.detections
    target: renderer.render_overlay.detections
