# TEMPLATE — Шаблон для создания новой topology
#
# Инструкция:
#   1. Скопируйте этот файл в topology/<ваше_имя>.yaml
#   2. Замените placeholder-значения на реальные
#   3. Запустите: python multiprocess_prototype/run.py topology/<ваше_имя>.yaml
#
# Документация плагинов: см. Plugins/*/README.md

# --- Метаданные ---
name: my_pipeline              # Уникальное имя topology
description: "Описание системы"  # Человекочитаемое описание

# --- Процессы ---
# Каждый процесс = GenericProcessApp с набором плагинов.
# chain_targets определяет кому процесс отправляет результат.
processes:
  # Презентация: объявляется ЗДЕСЬ, в headless-воплощении. presentation-overlay
  # подменяет класс на Qt-шный (frontend/presentation.yaml). Адрес, который никто
  # не объявил, отвергается сборкой — см. SystemBlueprint._unaddressable_chain_targets.
  - process_name: gui
    protected: true
    process_class: multiprocess_prototype.frontend.headless_process.HeadlessGuiProcess
    plugins: []

  # Источник данных (камера)
  - process_name: camera_0           # Уникальное имя процесса
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    priority: high                    # high | normal | low
    chain_targets:                    # Кому отправлять результат
      - processor
    source_target_fps: 25             # Целевой FPS (только для source-процессов)
    plugins:
      - plugin_class: Plugins.sources.camera_service.plugin.CameraServicePlugin
        plugin_name: camera_service   # Уникальное имя плагина в процессе
        category: source              # source | processing | rendering | control | output | service | utility
        # Параметры плагина (см. plugin config_schema):
        camera_type: simulator        # simulator | opencv | hikvision
        camera_id: 0
        resolution_width: 640
        resolution_height: 480
        auto_start: true

  # Обработка
  - process_name: processor
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    priority: normal
    chain_targets:
      - gui
    # extras:
    #   cv_threads: 2                 # Потоки внутреннего пула OpenCV в ЭТОМ процессе (по умолчанию 2).
    #   Только под extras: плоский `cv_threads:` молча уходит в metadata и до процесса не доходит.
    #   Не наши воркеры: OpenCV сам режет кадр на куски, и без настройки пул = числу ядер в КАЖДОМ
    #   процессе, так что процессы дерутся за ядра. Больше (4–8) выгодно одному тяжёлому процессу на
    #   большом кадре, пока остальные простаивают; 1 — лёгкой обработке и мелким кадрам. Прикидка:
    #   сумма cv_threads одновременно загруженных процессов ≈ числу ядер. Подбирать замером (CPU
    #   процесса + время плагина в backend_ctl), не на глаз; фактическое значение — introspect.status.
    #   overflow: latest              # Политика переполнения: latest (умолчание) | every. ТОЛЬКО под extras.
    #   Под `latest` кадр, не успевший в бюджет «в полёте», молча выбрасывается и считается. Под `every` на его
    #   месте идёт маркер `not_inspected` — по одному на потерянный кадр (приёмник, restore, исполнитель, дверь);
    #   отбраковщик (`robot_control`) реагирует по регистру `not_inspected_action: reject|pass`. Включать на узлах
    #   инспекции цепочки целиком. ADR-174 в multiprocess_framework/DECISIONS.md.
    #   Ловушка плоской формы: `overflow: every` прямо у процесса (не под extras) сворачивается в `metadata` и
    #   молча игнорируется — бэкенд остаётся на `latest`, ошибки нет (см. _FLAT_FORM_NOT_ACCEPTED в
    #   multiprocess_prototype/domain/tests/test_entities_roundtrip.py).
    plugins:
      # Добавьте processing-плагины:
      # - color_mask, grayscale, negative, flip, resize
      # - blob_detector, region_split, stitcher
      # - render_overlay, renderer_compositor
      # Пример:
      - plugin_class: Plugins.processing.grayscale.plugin.GrayscalePlugin
        plugin_name: grayscale
        category: processing

  # GUI (отображение) — НЕ объявляется здесь: процесс `gui` живёт в фундаменте
  # (backend/topology/base.yaml) и суммируется при запуске. Pipeline адресует
  # его по имени через chain_targets: [gui] (см. процесс выше).

# --- Менеджеры (опционально) ---
# Конфигурация FW-менеджеров. Если не указано — используются defaults.
