# observability_sink.yaml — ПОДКЛЮЧАЕМЫЙ фрагмент фундамента: история телеметрии.
#
# Не входит ни в один запуск по умолчанию. Подключается СПИСКОМ в манифесте:
#
#   # multiprocess_prototype/app.yaml
#   base:
#     - backend/topology/base.yaml
#     - backend/topology/observability_sink.yaml
#
# Отключается удалением одной строки. Кто не подключил — не платит ничем: ни
# процессом ОС, ни записями в БД, ни строками в golden-снимках своего рецепта.
#
# Почему отдельным файлом, а не строчкой в base.yaml (решение 2026-08-23, есть
# замер): вписанный в общий фундамент процесс платят ВСЕ сборки — golden-снимки
# рецептов выросли на 375 строк каждый, а минимальный hello_world удвоил состав
# процессов. Список фрагментов даёт то же самое подключение, но адресно.
#
# Тот же приём годится любому always-on кирпичу инфраструктуры — рекордеру,
# профайлеру, экспортёру: свой файл, своя строка в манифесте, ноль правок в
# общем фундаменте и ноль флагов в коде.
#
# ЧТО ЭТО ДАЁТ: подписка на processes.** → семпл кэша по таймеру → строки в
# SQLite. Side-effect процесс, в потоке кадров не участвует (нет inputs/outputs).
#
# ЦЕНА НАЗВАНА: сток пишет то, что ЕДЕТ В ДЕРЕВО push'ом, а publisher-gate по
# умолчанию закрыт (``telemetry.publish.default_enabled: false``, белый список —
# fps/latency_ms). Плагинные метрики в строки БД не попадут, пока их имена не
# открыты явно. Пустой ``extra`` — это закрытый гейт, а НЕ поломка стока.
#
# ПРЕДУСЛОВИЕ, без которого фрагмент бесполезен: до починки голодания подписчика
# (resync блокировал приёмный поток на 5 с — ADR-SS-022 / ADR-RTR-011) сток писал
# строки БЕЗ данных: 297 строк, из них с непустым fps — ноль, а первое значение
# доходило через 16 минут. После починки замер на том же стенде: fps в строке
# camera_0 через 3.0 с от запуска, 42 строки с данными из 80 за 25 с, включая
# процессы lines и pult, которые до этого не получали ничего ни разу.

name: observability_sink
description: "Инфраструктура: история телеметрии в SQLite (подключаемый фрагмент)"

processes:
  - process_name: telemetry_sink
    process_class: multiprocess_prototype.generic_process_app.GenericProcessApp
    priority: low
    plugins:
      - plugin_class: Plugins.io.telemetry_sink.plugin.TelemetrySinkPlugin
        plugin_name: telemetry_sink
        category: output
        db_path: data/telemetry.db
        sample_interval_sec: 5.0

wires: []
