# presentation.yaml — ПРЕЗЕНТАЦИОННЫЙ OVERLAY (Ф2 frontend-constructor, 2026-07;
# пересмотрен планом D8, 2026-08-10).
#
# Overlay — это ПАТЧ поверх слитой топологии, а не второй список процессов:
#
#   merged     = merge_topologies(base, recipe)                  # фундамент ⊕ рецепт
#   merged     = apply_presentation_overlay(merged, presentation) # gui → GuiProcess
#
# Процесс ``gui`` объявляет РЕЦЕПТ — в headless-воплощении
# (``frontend.headless_process.HeadlessGuiProcess``): бэкенд headless-first, окно
# добавляется этим overlay'ем. Здесь подменяется только КЛАСС; имя, protected и
# прочие поля остаются рецептными.
#
# Патч НЕ добавляет процессов: если рецепт презентации не объявил (пробные
# рецепты вроде ``g1_perf_probe``), окна не будет и с overlay'ем — рисовать
# нечего, и добавлять приёмник, которому никто не шлёт, значило бы поднимать
# процесс зря. Несовпавшее объявление overlay'я называется предупреждением, а
# не пропускается молча.
#
# Как включить:
#   - явная точка входа фронта: multiprocess_prototype/frontend/run.py
#     (выставляет env INSPECTOR_PRESENTATION=<путь к этому файлу>);
#   - headless-флаг основного входа (INSPECTOR_HEADLESS=1 / --headless) ПЕРЕБИВАЕТ
#     этот overlay — окно не поднимается, ``gui`` остаётся дренирующим.

name: presentation
description: "Презентационный overlay: gui получает Qt-класс (PySide6)"

processes:
  - process_name: gui
    process_class: multiprocess_prototype.frontend.process.GuiProcess

wires: []
