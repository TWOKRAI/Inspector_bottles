# Пресет line_sim: русские буквы на дисках — ТЕ ЖЕ эталоны, что у dataset_gen
# (Services/dataset_gen/presets/real_letters_disk.yaml) — картинки не копируются,
# только путь к тому же каталогу. Эталоны готовит tools/cut_real_disks.py
# (см. Services/dataset_gen/README.md); на момент задачи (2026-09-22) каталог на
# машине разработчика отсутствует — см. Services/line_sim/STATUS.md.

# Путь к каталогу классов SpriteCatalog (подкаталог на класс, RGBA-эталоны внутри).
# Относительный — резолвится от каталога ЭТОГО файла (ScenePreset.from_yaml).
catalog_dir: ../../../data/dataset_gen/ru_letters_real/sprites

# Диапазон угла объекта на ленте, градусы, CCW (см. LS-003) — полный оборот, угол
# на диске не имеет выделенной стороны.
angle_range_deg: [0, 360]

# Вероятность дефект-слоя "damaged" на спавненном объекте (occlusion-пятно).
# 0.0 — брак не появляется сам по себе; форсировать конкретный объект — force_defect_next().
defect_probability: 0.0

# Доп. слои поверх базы (перед дефектом) — пока не нужны, база + дефект достаточно.
layers: []
