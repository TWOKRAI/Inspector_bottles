# Пресет line_sim: буквы из шрифтов на дисках — слой класса (Task 1.1b, блок A)
# поверх слоя диска-подложки, оба через LayeredObject.color_rgb (блок B). Эталоны
# букв генерирует tools/make_font_letters.py (Task 1.1b, блок C), не рисуются
# вручную. Пример команды сборки каталога (DejaVu из matplotlib — заглушка для
# примера; владелец подставит боевые TTF шрифта этикетки):
#
#   FONTS="$(python -c 'import matplotlib; print(matplotlib.get_data_path())')/fonts/ttf"
#   python -m Services.line_sim.tools.make_font_letters \
#       --letters АК \
#       --font "$FONTS/DejaVuSans.ttf" \
#       --font "$FONTS/DejaVuSans-Bold.ttf" \
#       --size-px 300 --letter-frac 0.6 \
#       --out data/line_sim/letters_font \
#       --disk-out data/line_sim/letters_font_disk.png

# Путь к каталогу классов SpriteCatalog (подкаталог на класс, RGBA-эталоны внутри) —
# результат команды выше. Относительный — резолвится от каталога ЭТОГО файла
# (ScenePreset.from_yaml).
catalog_dir: ../../../data/line_sim/letters_font

# Диапазон угла объекта на ленте, градусы, CCW (LS-003) — полный оборот, угол на
# диске не имеет выделенной стороны.
angle_range_deg: [0, 360]

# Вероятность дефект-слоя "damaged" (occlusion-пятно) — 0.0, брак не появляется сам
# по себе; форсировать конкретный объект — ObjectFactory.force_defect_next().
defect_probability: 0.0

# Слои объекта, снизу вверх: диск-подложка (белая заливка, файл из --disk-out), затем
# буква класса (чёрная заливка, разыгранный ObjectFactory спрайт — блок A/C).
layers:
  - name: disk
    mode: static
    sprite_source: ../../../data/line_sim/letters_font_disk.png
    color_rgb: [255, 255, 255]
    # Реальные диски-подложки не варьируются (один и тот же физический диск) — пример
    # включения аугментации оставлен закомментированным на случай, если понадобится
    # вариация масштаба (например разные партии дисков чуть отличаются диаметром):
    #
    # mode: augmented
    # augment:
    #   scale: [0.97, 1.03]

  - name: letter
    mode: static
    sprite_source: class://
    color_rgb: [0, 0, 0]
    # Буква тоже статична по умолчанию — печать на реальном диске не гуляет по
    # масштабу/углу/тону относительно диска. Пример включения аугментации буквы:
    #
    # mode: augmented
    # augment:
    #   scale: [0.95, 1.05]
    #   angle_deg: [-3.0, 3.0]
    #   hue_shift_deg: [-10.0, 10.0]
