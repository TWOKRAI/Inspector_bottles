# Конфигурация для scripts/code_stats/code_stats.py
#
# Запуск:
#   python scripts/code_stats/code_stats.py
#   python scripts/code_stats/code_stats.py --config scripts/code_stats/code_stats.toml
#   python scripts/code_stats/code_stats.py --root multiprocess_framework --format json
#
# CLI-аргументы перекрывают значения из этого файла.

[scan]
# Папки для анализа (можно несколько). Относительные пути — от текущей рабочей
# директории. Перекрывается позиционными аргументами CLI:
#   python scripts/code_stats/code_stats.py multiprocess_framework Services
paths = ["."]
# Рекурсивный обход подпапок.
recursive = true
# Следовать ли по симлинкам (false безопаснее: не зациклится).
follow_symlinks = false
# Считать только то, что знает git (tracked + untracked не-ignored).
# true = честная оценка проекта: сгенерированные кэши (graphify-out, дампы,
# датасеты) из .gitignore не попадают в цифры. false = весь диск как есть.
git_tracked = true

[formats]
# Расширения, которые учитываем. Регистр не важен. Пустой список = все файлы.
include = [".py", ".md", ".toml", ".yaml", ".yml", ".json", ".sh"]

[exclude]
# Имена директорий, которые пропускаем целиком (быстрый pruning).
dirs = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    "env",
    "node_modules",
    ".qex",
    ".sentrux",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]
# Glob-паттерны имён файлов, которые пропускаем.
file_patterns = ["*.pyc", "*.pyo", "*.so", "*.dylib", "*.dll", ".DS_Store"]
# Glob-паттерны путей (полный путь относительно root) — для точечных исключений.
path_patterns = []

[count]
# Считать ли пустые строки.
blank_lines = false
# Считать ли комментарии (см. правила для .py / .md / .sh ниже).
comments = true
# Считать ли docstring-блоки в .py (тройные кавычки на верхнем уровне модуля/функции).
docstrings = true
# Считать ли символы (помимо строк). Незначительные накладные расходы.
chars = true
# Считать ли слова. Определение как у `wc -w`: последовательности непробельных
# символов. Для .md это осмысленный объём текста, для .py — грубая мера.
words = true
# Кодировка для чтения. errors='replace' гарантирует, что бинарь-подобные файлы не уронят скрипт.
encoding = "utf-8"

[output]
# Формат вывода: table | json | csv
format = "table"
# Группировка строк отчёта: extension | directory | none
group_by = "extension"
# Сортировка: lines | words | chars | files | dirs | name
sort_by = "lines"
# Порядок сортировки: desc | asc
sort_order = "desc"
# Показывать ли итоговую строку TOTAL. TOTAL считается по ВСЕМ группам,
# даже если вывод обрезан limit'ом.
show_total = true
# Максимум строк в выводе (0 = без ограничений). Удобно при group_by = "directory".
limit = 0
# Глубина группировки при group_by = "directory":
#   0 — полный путь (multiprocess_framework/modules/logger_module/tests)
#   1 — только зона верхнего уровня (multiprocess_framework)
dir_depth = 0
